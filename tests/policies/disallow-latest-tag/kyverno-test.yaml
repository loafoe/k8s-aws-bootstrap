apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-latest-tag
policies:
  - ../../../charts/bootstrap/templates/kyverno/kyverno-disallow-latest-tag-policy.yaml
resources:
  - resources.yaml
results:
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources:
      - good-pod
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources:
      - latest-tag-pod
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources:
      - no-tag-pod
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: validate-image-tag
    resources:
      - good-pod
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: validate-image-tag
    resources:
      - latest-tag-pod
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: validate-image-tag
    resources:
      - no-tag-pod
    kind: Pod
    result: pass
