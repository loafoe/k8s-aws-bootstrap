apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aws-lbc-pod-identity
policies:
  - ../../../charts/bootstrap/templates/kyverno/kyverno-aws-lbc-pod-identity-policy.yaml
resources:
  - resources.yaml
results:
  - policy: validate-aws-lbc-pod-identity
    isValidatingPolicy: true
    resources:
      - aws-load-balancer-controller-good
    kind: Pod
    result: pass
  - policy: validate-aws-lbc-pod-identity
    isValidatingPolicy: true
    resources:
      - aws-load-balancer-controller-bad
    kind: Pod
    result: fail
  - policy: validate-aws-lbc-pod-identity
    isValidatingPolicy: true
    resources:
      - unrelated-pod
    kind: Pod
    result: skip
