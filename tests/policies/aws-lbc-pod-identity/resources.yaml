apiVersion: v1
kind: Pod
metadata:
  name: aws-load-balancer-controller-good
  namespace: aws-load-balancer-controller
spec:
  containers:
  - name: aws-load-balancer-controller
    image: aws-lbc:v2.9.0
    env:
    - name: AWS_ROLE_ARN
      value: arn:aws:iam::111111111111:role/aws-lbc
