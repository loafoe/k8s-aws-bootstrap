  name: helmapplication-forbid-argocd-finalizer
policies:
  - ../../../charts/bootstrap/templates/kyverno/kyverno-helmapplication-forbid-argocd-finalizer-policy.yaml
resources:
  - resources.yaml
results:
  - policy: helmapplication-forbid-argocd-finalizer
