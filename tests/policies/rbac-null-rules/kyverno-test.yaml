apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rbac-null-rules
# Policies are tested from rbac-argocd-exemption/rendered-policies/, not
# from charts/bootstrap/templates/kyverno/ directly: both policies now read
# their Argo CD exemption lists from charts/bootstrap/values.yaml via Helm
# templating, so the committed chart source is not valid standalone YAML.
# See scripts/render-rbac-exemption-test-fixtures.sh.
policies:
  - ../rbac-argocd-exemption/rendered-policies/kyverno-restrict-escalation-verbs-policy.yaml
  - ../rbac-argocd-exemption/rendered-policies/kyverno-restrict-wildcard-rbac-policy.yaml
resources:
  - resources.yaml
results:
  - policy: restrict-escalation-verbs
    isValidatingPolicy: true
    resources:
      - null-rules-clusterrole
    kind: ClusterRole
    result: pass
  - policy: restrict-escalation-verbs
    isValidatingPolicy: true
    resources:
      - null-rules-role
    kind: Role
    result: pass
  - policy: restrict-escalation-verbs
    isValidatingPolicy: true
    resources:
      - empty-rules-clusterrole
    kind: ClusterRole
    result: pass
  - policy: restrict-escalation-verbs
    isValidatingPolicy: true
    resources:
      - good-clusterrole
    kind: ClusterRole
    result: pass
  - policy: restrict-escalation-verbs
    isValidatingPolicy: true
    resources:
      - escalate-clusterrole
    kind: ClusterRole
    result: fail
  - policy: restrict-escalation-verbs
    isValidatingPolicy: true
    resources:
      - wildcard-clusterrole
    kind: ClusterRole
    # Was `pass` before CHAR-36: restrict-escalation-verbs now treats a
    # wildcard verb as granting escalation too, closing that blind spot.
    result: fail
  - policy: restrict-wildcard-rbac
    isValidatingPolicy: true
    resources:
      - null-rules-clusterrole
    kind: ClusterRole
    result: pass
  - policy: restrict-wildcard-rbac
    isValidatingPolicy: true
    resources:
      - null-rules-role
    kind: Role
    result: pass
  - policy: restrict-wildcard-rbac
    isValidatingPolicy: true
    resources:
      - empty-rules-clusterrole
    kind: ClusterRole
    result: pass
  - policy: restrict-wildcard-rbac
    isValidatingPolicy: true
    resources:
      - good-clusterrole
    kind: ClusterRole
    result: pass
  - policy: restrict-wildcard-rbac
    isValidatingPolicy: true
    resources:
      - escalate-clusterrole
    kind: ClusterRole
    result: pass
  - policy: restrict-wildcard-rbac
    isValidatingPolicy: true
    resources:
      - wildcard-clusterrole
    kind: ClusterRole
    result: fail
