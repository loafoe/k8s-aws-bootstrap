apiVersion: v1
kind: Pod
metadata:
  name: ebs-csi-controller-good
  namespace: aws-ebs-csi-driver
spec:
  serviceAccountName: aws-ebs-csi-driver
  containers:
  - name: ebs-plugin
    image: ebs-csi-driver:v1.35.0
    env:
    - name: AWS_ROLE_ARN
      value: arn:aws:iam::111111111111:role/ebs-csi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-csi-controller-bad
  namespace: aws-ebs-csi-driver
spec:
  serviceAccountName: default
  containers:
  - name: ebs-plugin
    image: ebs-csi-driver:v1.35.0
---
apiVersion: v1
kind: Pod
metadata:
  name: unrelated-pod
  namespace: default
spec:
  containers:
  - name: app
    image: nginx:1.27.2
