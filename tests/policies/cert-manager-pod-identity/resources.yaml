apiVersion: v1
kind: Pod
metadata:
  name: cert-manager-good
  namespace: cert-manager
  labels:
    app.kubernetes.io/component: controller
spec:
  serviceAccountName: cert-manager
  containers:
  - name: cert-manager
    image: cert-manager-controller:v1.16.0
---
apiVersion: v1
kind: Pod
metadata:
  name: cert-manager-bad
  namespace: cert-manager
  labels:
    app.kubernetes.io/component: controller
spec:
  serviceAccountName: default
  containers:
  - name: cert-manager
    image: cert-manager-controller:v1.16.0
---
apiVersion: v1
kind: Pod
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
  labels:
    app.kubernetes.io/component: webhook
spec:
  serviceAccountName: cert-manager-webhook
  containers:
  - name: cert-manager-webhook
    image: cert-manager-webhook:v1.16.0
