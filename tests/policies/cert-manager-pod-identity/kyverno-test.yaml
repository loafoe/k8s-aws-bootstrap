apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cert-manager-pod-identity
policies:
  - ../../../charts/bootstrap/templates/kyverno/kyverno-cert-manager-pod-identity-policy.yaml
resources:
  - resources.yaml
results:
  - policy: validate-cert-manager-serviceaccount-pod-identity
    isValidatingPolicy: true
    resources:
      - cert-manager-good
    kind: Pod
    result: pass
  - policy: validate-cert-manager-serviceaccount-pod-identity
    isValidatingPolicy: true
    resources:
      - cert-manager-bad
    kind: Pod
    result: fail
  - policy: validate-cert-manager-serviceaccount-pod-identity
    isValidatingPolicy: true
    resources:
      - cert-manager-webhook
    kind: Pod
    result: skip
