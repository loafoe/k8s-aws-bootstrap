apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: karpenter-pod-identity
policies:
  - ../../../charts/bootstrap/templates/kyverno/kyverno-karpenter-pod-identity-policy.yaml
resources:
  - resources.yaml
results:
  - policy: validate-karpenter-pod-identity
    isValidatingPolicy: true
    resources:
      - karpenter-good
    kind: Pod
    result: pass
  - policy: validate-karpenter-pod-identity
    isValidatingPolicy: true
    resources:
      - karpenter-bad
    kind: Pod
    result: fail
  - policy: validate-karpenter-pod-identity
    isValidatingPolicy: true
    resources:
      - unrelated-pod
    kind: Pod
    result: skip
  - policy: validate-karpenter-serviceaccount-pod-identity
    isValidatingPolicy: true
    resources:
      - karpenter-good
    kind: Pod
    result: pass
  - policy: validate-karpenter-serviceaccount-pod-identity
    isValidatingPolicy: true
    resources:
      - karpenter-bad
    kind: Pod
    result: fail
  - policy: validate-karpenter-serviceaccount-pod-identity
    isValidatingPolicy: true
    resources:
      - unrelated-pod
    kind: Pod
    result: skip
