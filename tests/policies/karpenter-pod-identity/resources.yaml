apiVersion: v1
kind: Pod
metadata:
  name: karpenter-good
  namespace: karpenter
spec:
  serviceAccountName: karpenter
  containers:
  - name: controller
    image: karpenter:1.0.0
    env:
    - name: AWS_ROLE_ARN
      value: arn:aws:iam::111111111111:role/karpenter
---
apiVersion: v1
kind: Pod
metadata:
  name: karpenter-bad
  namespace: karpenter
spec:
  serviceAccountName: default
  containers:
  - name: controller
    image: karpenter:1.0.0
---
apiVersion: v1
kind: Pod
metadata:
  name: unrelated-pod
  namespace: default
spec:
  containers:
  - name: app
    image: nginx:1.27.2
