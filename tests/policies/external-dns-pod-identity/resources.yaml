apiVersion: v1
kind: Pod
metadata:
  name: external-dns-good
  namespace: external-dns
spec:
  serviceAccountName: external-dns
  containers:
  - name: external-dns
    image: external-dns:v0.15.0
    env:
    - name: AWS_ROLE_ARN
      value: arn:aws:iam::111111111111:role/external-dns
---
apiVersion: v1
kind: Pod
metadata:
  name: external-dns-bad
  namespace: external-dns
spec:
  serviceAccountName: default
  containers:
  - name: external-dns
    image: external-dns:v0.15.0
---
apiVersion: v1
kind: Pod
metadata:
  name: unrelated-pod
  namespace: default
spec:
  containers:
  - name: app
    image: nginx:1.27.2
