apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: external-dns-pod-identity
policies:
  - ../../../charts/bootstrap/templates/kyverno/kyverno-external-dns-pod-identity-policy.yaml
resources:
  - resources.yaml
results:
  - policy: validate-external-dns-pod-identity
    isValidatingPolicy: true
    resources:
      - external-dns-good
    kind: Pod
    result: pass
  - policy: validate-external-dns-pod-identity
    isValidatingPolicy: true
    resources:
      - external-dns-bad
    kind: Pod
    result: fail
  - policy: validate-external-dns-pod-identity
    isValidatingPolicy: true
    resources:
      - unrelated-pod
    kind: Pod
    result: skip
  - policy: validate-external-dns-serviceaccount-pod-identity
    isValidatingPolicy: true
    resources:
      - external-dns-good
    kind: Pod
    result: pass
  - policy: validate-external-dns-serviceaccount-pod-identity
    isValidatingPolicy: true
    resources:
      - external-dns-bad
    kind: Pod
    result: fail
  - policy: validate-external-dns-serviceaccount-pod-identity
    isValidatingPolicy: true
    resources:
      - unrelated-pod
    kind: Pod
    result: skip
