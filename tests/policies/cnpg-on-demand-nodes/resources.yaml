apiVersion: v1
kind: Pod
metadata:
  name: cnpg-pod
  namespace: default
  labels:
    cnpg.io/cluster: mycluster
spec:
  containers:
  - name: postgres
    image: cloudnative-pg:1.24.0
---
apiVersion: v1
kind: Pod
metadata:
  name: non-cnpg-pod
  namespace: default
spec:
  containers:
  - name: app
    image: nginx:1.27.2
