# Where every non-built-in API group used by charts/bootstrap's app-of-apps comes from,
# and the earliest sync-wave at which it is guaranteed to exist.
#
# check-sync-wave-crds.sh fails on a resource whose own effective wave is <= the wave
# recorded here for its API group, unless that resource (or its whole Application; see
# the sync-options exemptions below) opts out with
# argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true. It also fails on any
# non-built-in group it finds that isn't listed here at all -- that is the forcing
# function: a chart bump or a new resource that introduces a CRD-backed kind makes you
# add (or correct) an entry instead of finding out on a fresh cluster.
#
# A group's wave is either:
#   - the sync-wave of the Application whose rendered output contains a literal
#     CustomResourceDefinition for it (most charts), or
#   - for a group no Application ever renders a CRD for, because Crossplane installs it
#     itself at runtime from a Provider/Function package: the sync-wave of the
#     Application that installs that package.
#
# providedBy is the Application's own metadata.name (matched exactly, so a resource
# belonging to the SAME Application that provides its group is never flagged: a chart
# that renders its own CRD alongside resources using it, like kube-prometheus-stack's
# Prometheus CRDs and its own Prometheus/Alertmanager CRs, applies both in one atomic
# sync -- that's not the "wrong wave" bug, it's the normal case every chart with its own
# CRDs relies on), plus two sentinels that never match an Application name and so are
# never self-exempt:
#   - "root": a literal CRD rendered by charts/bootstrap itself, not by a child app
#   - "pre-existing": installed once outside Argo CD entirely, before any sync-wave runs
#
# Patterns may end in "*" to match every group with that suffix (crossplane's upbound
# providers mint one group per AWS service, e.g. s3.aws.upbound.io, kms.aws.upbound.io;
# listing each by hand would just mean every new provider resource type silently adds
# another entry here to keep in sync).

groups:
  # Installed once, outside Argo CD entirely, by the master's own bootstrap kustomization
  # (k3s-on-ec2's pkg/bootstrap: "Cilium/Argo CD/Crossplane kustomization, EnvironmentConfig")
  # before any sync-wave runs -- never wave-gated. The matching Applications here
  # (cilium wave 0, argocd wave 10, crossplane wave 2) only take over ongoing management
  # of an install that already happened; they are not the first install.
  - group: argoproj.io
    providedBy: pre-existing
    wave: -1
  - group: apiextensions.crossplane.io
    providedBy: pre-existing
    wave: -1
  - group: pkg.crossplane.io
    providedBy: pre-existing
    wave: -1

  # Rendered as literal CRDs by the apps that own them.
  - group: cert-manager.io
    providedBy: cert-manager
    wave: 0
  - group: karpenter.sh
    providedBy: karpenter
    wave: 3
  - group: karpenter.k8s.aws
    providedBy: karpenter
    wave: 3
  - group: kyverno.io
    providedBy: kyverno
    wave: 5
  - group: policies.kyverno.io
    providedBy: kyverno
    wave: 5
  - group: gateway.networking.k8s.io
    providedBy: root
    wave: 0
  - group: iamauthenticator.k8s.aws
    providedBy: root
    wave: 0
  - group: spire.spiffe.io
    providedBy: spire-crds
    wave: 12
  - group: monitoring.coreos.com
    providedBy: kube-prometheus-stack
    wave: 16
  # Deliberately early: three apps render VerticalPodAutoscalers (kube-prometheus-stack
  # wave 16, crossplane-providers-aws wave 18, cloudnative-pg-operator wave 21), and a VPA
  # cannot be applied before this app installs the CRDs.
  - group: autoscaling.k8s.io
    providedBy: vertical-pod-autoscaler
    wave: 15

  # Not in any chart's rendered output: Crossplane's package manager installs these AWS
  # provider groups dynamically once crossplane-providers-aws's Provider resources sync
  # (pkg.crossplane.io itself is pre-existing, above -- it comes from Crossplane core,
  # not a provider package).
  - group: "*aws.upbound.io"
    providedBy: crossplane-providers-aws
    wave: 18
  - group: "*aws.m.upbound.io"
    providedBy: crossplane-providers-aws
    wave: 18
