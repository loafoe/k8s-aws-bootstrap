descheduler:
  kind: Deployment
  deschedulingInterval: 5m
  replicas: 1

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: karpenter.sh/nodepool
                operator: DoesNotExist
              - key: node-type
                operator: In
                values:
                  - system
                  - control-plane

  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

  deschedulerPolicy:
    profiles:
      - name: default
        pluginConfig:
          - name: DefaultEvictor
            args:
              evictSystemCriticalPods: false
              evictFailedBarePods: false
              evictLocalStoragePods: false

          - name: RemovePodsHavingTooManyRestarts
            args:
              podRestartThreshold: 5
              includingInitContainers: true

          - name: RemovePodsViolatingTopologySpreadConstraint
            args:
              constraints:
                - DoNotSchedule
                - ScheduleAnyway
              namespaces:
                exclude:
                  - kube-system
                  - karpenter

        plugins:
          balance:
            # LowNodeUtilization removed (2026-11-12): it fought Karpenter's
            # own consolidation - moving pods off nodes above 70% onto nodes
            # below 30% while Karpenter removes underutilized nodes - and
            # caused 99 of 101 evictions on dip-ce-k3s-eu (about 100 pods a
            # day: centcom, satellites, MCP proxies, ClickHouse), each
            # eviction a short outage for single-path services. Karpenter
            # already handles bin-packing; don't re-add it on Karpenter
            # clusters.
            enabled:
              - RemovePodsViolatingTopologySpreadConstraint
          deschedule:
            enabled:
              - RemovePodsHavingTooManyRestarts
