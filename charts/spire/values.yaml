spire:
  global:
    installAndUpgradeHooks:
      enabled: false
    deleteHooks:
      enabled: false

  spire-server:
    enabled: true
    replicaCount: 1

    resources:
      requests:
        cpu: 100m
        memory: 160Mi
      limits:
        memory: 256Mi

    dataStore:
      sql:
        databaseType: sqlite3
        databaseName: /run/spire/data/datastore.sqlite3

    nodeAttestor:
      k8sPSAT:
        enabled: true

    controllerManager:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node-type
              operator: In
              values:
              - system
              - control-plane
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

  spire-agent:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    socketPath: /run/spire/agent-sockets/spire-agent.sock
    # The chart's socketAlternate init container (it symlinks the CSI socket's alternate
    # names) defaults to cgr.dev/chainguard/bash -- the last cgr.dev reference in the
    # dependency set. It only runs `sh -xc` with readlink/ln/rm, so any POSIX shell does.
    # busybox from docker.io rather than a ghcr image on purpose: ghcr has no busybox or
    # alpine distribution image (only ghcr.io/containerd/busybox, containerd's integration
    # test image), and this exact reference is already in images.lock via spike-pilot, so
    # it adds no new registry and no new pre-cache entry. docker.io is covered by the ECR
    # pull-through `docker-hub` alias like every other upstream we pull from.
    socketAlternate:
      image:
        registry: docker.io
        repository: library/busybox
        # renovate: datasource=docker depName=library/busybox
        tag: 1.38.0-uclibc
    # The fsgroupfix init container (it chowns the socket dir to the pod's fsGroup) only
    # renders once global.spire.recommendations.securityContexts sets a non-zero fsGroup
    # on this pod -- recommendations were off until now, so it never rendered and its
    # cgr.dev/chainguard/bash default never showed up here. It only runs `chown -R`, so
    # the same busybox pin as socketAlternate above covers it; see that comment for why
    # docker.io/busybox rather than a ghcr image.
    fsGroupFix:
      image:
        registry: docker.io
        repository: library/busybox
        # renovate: datasource=docker depName=library/busybox
        tag: 1.38.0-uclibc
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: node-role.kubernetes.io/control-plane
      operator: Exists

  spiffe-csi-driver:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 12Mi
      limits:
        memory: 24Mi
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: node-role.kubernetes.io/control-plane
      operator: Exists

  spiffe-oidc-discovery-provider:
    enabled: false
