spire:
  global:
    installAndUpgradeHooks:
      enabled: false
    deleteHooks:
      enabled: false

  spire-server:
    enabled: true
    replicaCount: 1

    resources:
      requests:
        cpu: 100m
        memory: 160Mi
      limits:
        memory: 256Mi

    dataStore:
      sql:
        databaseType: sqlite3
        databaseName: /run/spire/data/datastore.sqlite3

    nodeAttestor:
      k8sPSAT:
        enabled: true

    controllerManager:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node-type
              operator: In
              values:
              - system
              - control-plane
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

  spire-agent:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    socketPath: /run/spire/agent-sockets/spire-agent.sock
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
    # spire-agent needs no pod networking and must register csi.spiffe.io
    # (via spiffe-csi-driver) before these taints will ever clear - tolerate
    # both so it isn't blocked on itself.
    - key: node.cilium.io/agent-not-ready
      operator: Exists
    - key: k8s-aws-bootstrap.io/csi-not-ready
      operator: Exists

  spiffe-csi-driver:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 12Mi
      limits:
        memory: 24Mi
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
    # Must be able to schedule and register csi.spiffe.io before
    # k8s-aws-bootstrap.io/csi-not-ready can ever clear - tolerate both new
    # readiness taints so it isn't blocked on itself.
    - key: node.cilium.io/agent-not-ready
      operator: Exists
    - key: k8s-aws-bootstrap.io/csi-not-ready
      operator: Exists

  spiffe-oidc-discovery-provider:
    enabled: false
