cilium:
  # Pin pre-1.20 defaults (e.g. Envoy xDS mode) across the 1.19->1.20 chart bump to
  # avoid a datapath behavior change mid-upgrade. Remove once fully on 1.20+ and
  # defaults are verified. Note: this does NOT cover bpf-lb-sock-hostns-only /
  # bpf-lb-algorithm-annotation, which Cilium 1.20 force-enables unconditionally
  # whenever gatewayAPI.enabled=true (required for per-backend TCPRoute/UDPRoute
  # weighting) - that change lands regardless of this pin.
  upgradeCompatibility: "1.19"

  # Networking Configuration
  tunnelProtocol: vxlan
  autoDirectNodeRoutes: false
  routingMode: tunnel
  kubeProxyReplacement: true

  # Bandwidth Manager - improves TCP performance for high-throughput workloads
  bandwidthManager:
    enabled: true
    bbr: true  # BBR congestion control for better throughput

  # API Server Configuration
  k8sServicePort: "6443"

  # Socket-level Load Balancing
  socketLB:
    enabled: true
    hostNamespaceOnly: false
    # Terminate cached connections when backend pods are removed - prevents stale
    # connection errors ("operation not permitted") after pod restarts/rollouts
    terminatePodConnections: true

  # BPF Configuration
  bpf:
    masquerade: true
    tproxy: true
    lbExternalClusterIP: true

  # Load Balancer Configuration
  loadBalancer:
    algorithm: random
    mode: snat

  # Gateway API Configuration
  gatewayAPI:
    enabled: true
    externalTrafficPolicy: Cluster
    enableAlpn: true
    enableAppProtocol: true

  # Envoy Configuration
  envoy:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: kps
    tolerations:
      - operator: Exists
    # envoy was OOMKilling repeatedly (exit 137) on every worker node under the
    # 74Mi limit, causing intermittent TLS connection resets (ERR_CONNECTION_RESET)
    # for clients of any hostname on the shared `platform` Gateway - observed
    # 2026-09-03. Idle usage is ~20-26Mi; raised for headroom as the number of
    # attached HTTPS routes grows, mirroring the cilium-agent resources note above.
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 20m
        memory: 64Mi

  # Prometheus Metrics
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kps
    metrics:
      - "+bpf_syscall_duration_seconds"
      - "+fqdn_active_names"
      - "+fqdn_active_ips"
      - "+fqdn_alive_zombie_connections"
      - "+k8s_event_lag_seconds"
      - "+cidrgroup_translation_time_stats_seconds"
      - "+api_limiter_wait_history_duration_seconds"

  # Hubble Observability Platform
  hubble:
    enabled: true
    relay:
      enabled: true
      replicas: 1
      # Prefer system nodes, then karpenter-managed nodes. Soft (preferred)
      # affinity so the pod stays schedulable even when neither node-type is
      # available, while favoring system when it is.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - system
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - karpenter-managed
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
        - key: node.kubernetes.io/unreachable
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
      resources:
        limits:
          memory: 40Mi
        requests:
          cpu: 20m
          memory: 32Mi
    ui:
      enabled: true
      replicas: 1
      # Prefer system nodes, then karpenter-managed nodes. Soft (preferred)
      # affinity so the pod stays schedulable even when neither node-type is
      # available, while favoring system when it is.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - system
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - karpenter-managed
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
        - key: node.kubernetes.io/unreachable
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
      backend:
        resources:
          limits:
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
      frontend:
        resources:
          limits:
            memory: 16Mi
          requests:
            cpu: 10m
            memory: 8Mi
    metrics:
      enableOpenMetrics: true
      serviceMonitor:
        enabled: true
        labels:
          release: kps
      enabled:
        - dns:query;ignoreAAAA;destinationContext=pod
        - drop:sourceContext=pod;destinationContext=pod
        - tcp:sourceContext=pod;destinationContext=pod
        - flow:sourceContext=pod;destinationContext=pod
        - icmp:sourceContext=pod;destinationContext=pod
        - httpV2:sourceContext=pod;destinationContext=pod;exemplars=true
        - flows-to-world:destinationContext=pod
        - port-distribution:sourceContext=pod;destinationContext=pod
        - kafka:sourceContext=pod;destinationContext=pod
        - policy:sourceContext=pod;destinationContext=pod
    # --- SECURITY: redact HTTP header values in ALL Hubble L7 flows ------------
    # This is the parser-level control (pkg/hubble/parser/seven/http.go
    # filterHeader) and it sits *upstream* of every Hubble consumer: the
    # static exporter, relay, the UI and the hubble_http_* metrics. That makes
    # it defence-in-depth over hubble.export.static.fieldMask below, which only
    # protects the static export.
    #
    # Matching is case-insensitive (the allow/deny lists and the header keys
    # are both lowercased before comparison), and it applies to REQUEST and
    # RESPONSE records alike. Redacted values are replaced in place with the
    # literal "HUBBLE_REDACTED" -- the header KEY stays visible, so you can
    # still see that a header was present and debug around it.
    #
    # We use an ALLOW list, which is default-deny: anything not named here is
    # redacted, so a newly introduced sensitive header is protected
    # automatically rather than leaking until someone remembers to add it.
    # (A deny list is allow-by-default and is the weaker option here.)
    #
    # Note filterHeader's other branch: enabling redact with BOTH lists empty
    # redacts every header value. That is the strictest setting and is the
    # right choice if the list below ever needs to be emptied -- keep at least
    # one allow entry to retain the debugging headers.
    #
    # Deliberately NOT allowed: Authorization (SPIFFE JWT-SVIDs), Cookie,
    # Set-Cookie, Proxy-Authorization, X-Forwarded-*, and the :scheme/:path/
    # :authority pseudo-headers (path/query already ride in l7.http.url).
    redact:
      enabled: true
      http:
        # Non-sensitive headers kept visible for debugging. Everything else is
        # replaced with HUBBLE_REDACTED.
        headers:
          allow:
            - user-agent
            - accept
            - accept-encoding
            - accept-language
            - content-type
            - content-length
            - cache-control
            - x-request-id
            - x-envoy-upstream-service-time
            - traceparent
            - tracestate
        # urlQuery stays false: it is a separate knob and turning it on would
        # also strip query strings, which changes access-log usefulness
        # cluster-wide. Query strings can carry tokens (`?access_token=`,
        # OAuth `?code=`), so treat this as an open decision rather than an
        # oversight -- see the PR description.
        urlQuery: false
        # userInfo (basic-auth password in the URL) is on by default upstream;
        # set explicitly so the intent survives a future chart default change.
        userInfo: true

    # Hubble Flow Export — Gateway API / Envoy L7 (HTTP) access logs.
    # Static exporter is bound to the agent lifecycle and rotates natively.
    # The file is tailed off-node by a logs collector (configured separately).
    export:
      static:
        enabled: true
        filePath: /var/run/cilium/hubble/events.log
        # --- SECURITY: keep everything EXCEPT l7.http.headers ---------------------
        # Hubble L7 records carry the FULL HTTP request/response headers, so
        # with an empty fieldMask (the chart default) every
        # `Authorization: Bearer <JWT>` — including the SPIFFE JWT-SVIDs minted
        # for service workloads — was written verbatim to
        # /var/run/cilium/hubble/events.log and shipped as-is to Loki by the
        # `k8s-monitoring-alloy-logs` collector. Anyone with Loki read access
        # could replay those tokens.
        #
        # fieldMask is an INCLUDE list with no "!" exclusion syntax (the
        # upstream docs show "keep all except X" by enumerating everything
        # else), so dropping one field means listing all the others. An empty
        # mask is *not* "nothing" — `fieldmask.FieldMask.Active()` returns
        # len(mask) > 0, so empty means the exporter skips the copy step and
        # encodes the whole flow. Verified against cilium 1.20.2:
        # pkg/hubble/exporter/exporter.go:187 and
        # pkg/hubble/parser/fieldmask/fieldmask.go.
        #
        # This is an explicit allow-list, so any field added by a future Cilium
        # release is dropped until reviewed rather than silently exported.
        #
        # `l7` is deliberately enumerated field-by-field instead of taken
        # wholesale: `l7` or `l7.http` alone would pull l7.http.headers back in
        # (a mask leaf copies the entire subtree).
        #
        # `source`/`destination` are safe to take wholesale — Endpoint is only
        # {identity, cluster_name, namespace, labels, pod_name, workloads} and
        # carries no headers.
        #
        # Paths are resolved against the Flow protobuf descriptor by proto
        # field name (snake_case) via fieldmaskpb.ByName, NOT by JSON name —
        # "nodeName"/"l7.http.code" style camelCase is rejected and would fail
        # exporter construction. Verified against
        # api/v1/flow/flow.proto @ v1.20.2 (95 reachable leaves; this mask
        # covers 94 and excludes exactly one: l7.http.headers).
        fieldMask:
          # --- Top-level Flow fields, taken wholesale (no sensitive data) ---
          - time
          - uuid
          - emitter
          - verdict
          - drop_reason
          - auth_type
          - ethernet
          - IP
          - l4
          - tunnel
          - source
          - destination
          - Type
          - node_name
          - node_labels
          - source_names
          - destination_names
          - reply
          - event_type
          - source_service
          - destination_service
          - traffic_direction
          - policy_match_type
          - trace_observation_point
          - trace_reason
          - file
          - ip_trace_id
          - drop_reason_desc
          - is_reply
          - debug_capture_point
          - interface
          - proxy_port
          - trace_context
          - sock_xlate_point
          - socket_cookie
          - cgroup_id
          - Summary
          - extensions
          - egress_allowed_by
          - ingress_allowed_by
          - egress_denied_by
          - ingress_denied_by
          - policy_log
          - aggregate
          # --- l7, field-by-field: everything except l7.http.headers ---
          - l7.type
          - l7.latency_ns
          # DNS and Kafka records carry no HTTP headers.
          - l7.dns
          - l7.kafka
          # HTTP access log metadata is retained...
          - l7.http.code
          - l7.http.method
          - l7.http.url
          - l7.http.protocol
          # ...but l7.http.headers is intentionally OMITTED.
        # event_type 129 = AccessLog (L7/HTTP) — verified against live Hubble
        # records on dip-ce-k3s-eu. Excludes L3/L4 flow noise.
        allowList:
          - '{"event_type":[{"type":129}]}'
        fileMaxSizeMb: 50
        fileMaxBackups: 5
        fileCompress: true

  # Operator Configuration
  operator:
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: kps
    replicas: 2
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-type
                  operator: In
                  values:
                    - system
                    - control-plane
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  io.cilium/app: operator
    tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
      - key: node.kubernetes.io/unreachable
        operator: Exists
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
      - key: node.kubernetes.io/memory-pressure
        operator: Exists
      - key: node.kubernetes.io/pid-pressure
        operator: Exists
      - key: node.kubernetes.io/unschedulable
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
    # cilium-operator on dip-ce-k3s-eu runs at ~126-132Mi against its 160Mi
    # limit (~80-83%, matching the "High usage" alert). Raised for headroom;
    # CPU usage is negligible (<10m against 50m request), left unchanged.
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

  # Agent (DaemonSet) Configuration
  # Roll agent pods whenever the cilium-config ConfigMap changes. The chart
  # gates the `cilium.io/cilium-configmap-checksum` pod annotation behind this
  # flag and defaults it to false, so without it the agents keep running with
  # their original startup flags and ConfigMap-only changes are silently inert.
  # That matters for anything read once at agent startup — notably
  # hubble.export.static.fieldMask below, which is parsed when the static
  # exporter is constructed. With this off, tightening the fieldMask would
  # appear to apply in Git while the running agents still export full L7
  # headers. Verified on dip-ce-k3s-eu: the DaemonSet carried no checksum
  # annotation, and a ConfigMap patch produced no pod recreation.
  rollOutCiliumPods: true

  tolerations:
    - operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/not-ready
      operator: Exists
    - key: node.kubernetes.io/unreachable
      operator: Exists
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
    - key: node.kubernetes.io/memory-pressure
      operator: Exists
    - key: node.kubernetes.io/pid-pressure
      operator: Exists
    - key: node.kubernetes.io/unschedulable
      operator: Exists
    - key: CriticalAddonsOnly
      operator: Exists
    - key: node.cilium.io/agent-not-ready
      operator: Exists

  # cilium-agent on dip-ce-k3s-eu runs at 283-340Mi against its 384Mi limit
  # (82-89%). Raised for headroom; WireGuard + Hubble export add memory as
  # node/pod counts grow.
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Device Configuration
  # Explicitly set devices to ensure all IPv6 addresses are detected for NodePort
  # ens+ for most EC2 instances, enp+ for m7a and other PCI-based naming
  devices: "ens+ enp+"
  directRoutingDevice: ""

  # NodePort Configuration
  # Bind NodePort to all addresses (including global IPv6) for dualstack NLB support
  nodePort:
    enableHealthCheckNodePort: true

  # Encryption Configuration
  # WireGuard transparent encryption for pod-to-pod traffic. nodeEncryption
  # also encrypts host/node-to-node traffic between Cilium-managed nodes; the
  # control-plane node is auto-exempted by Cilium to avoid a key-rotation
  # bootstrap deadlock. WireGuard auto-generates per-node keys (no secrets to
  # manage). In tunnel/vxlan mode traffic is double-encapsulated, but the EC2
  # 9001 (jumbo) MTU leaves ample headroom.
  encryption:
    enabled: true
    type: wireguard
    nodeEncryption: true

  # Policy Configuration
  policyEnforcementMode: default
  identityAllocationMode: crd

  # Disable CiliumEndpointSlice (obsolete)
  ciliumEndpointSlice:
    enabled: false

  # API Rate Limiting - increased for faster endpoint reconciliation
  k8sClientRateLimit:
    qps: 20
    burst: 40
