kube-prometheus-stack:
  fullnameOverride: kps

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 128Mi

  prometheus:
    prometheusSpec:
      enableOTLPReceiver: true
      # Discover ServiceMonitors/PodMonitors/Rules/Probes/ScrapeConfigs across all
      # namespaces without requiring the `release: kps` label. Setting these to false
      # makes a nil selector mean "match everything" (matches our EKS clusters).
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      # Prometheus was OOMKilled (exit 137) on dip-ce-k3s-eu, 247 restarts in
      # 30h. Cause: WAL replay is a startup-time memory spike. The TSDB lives on
      # an emptyDir, so every pod recreate replays the WAL from segment 0; with
      # 262 segments accumulated the replay needs more than the 2100Mi limit, so
      # the container died before finishing replay, restarted, and replayed the
      # same WAL again -- a self-sustaining OOM loop that only broke once the
      # emptyDir was recreated empty.
      #
      # 3Gi gives the replay spike headroom while keeping steady-state usage
      # (~1.3Gi at 448k series) well inside the limit. Only the *limit* moves:
      # the request stays at 1Gi because this node is already at 93% of its
      # memory-request budget, and raising the request would make the pod
      # unschedulable. Limits do not participate in scheduling.
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 3Gi

      # Persist the TSDB. Previously it lived on an emptyDir, so every pod
      # recreate wiped 10 days of history and rebuilt the WAL from scratch --
      # which is what turned a memory spike into a permanent OOM loop.
      #
      # gp3 (the cluster default storage class) rather than the io1-encrypted
      # class ci-obs-euw1 uses; io1 does not exist on this cluster. 20Gi
      # covers 10d retention at the current ~450k series with room to grow.
      #
      # Note: EBS is AZ-bound. Once this binds, Prometheus is pinned to the AZ
      # of the node it first lands on (currently eu-west-2b). That is
      # acceptable here because both eu-west-2b workers have disk and memory
      # headroom, but it is a real constraint if the node pool is later
      # consolidated to a single AZ.
      #
      # Keyed as storageSpec, not storage: kube-prometheus-stack 88.x renamed
      # this value, and `storage` is silently dropped by the subchart template.
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi

  prometheusOperator:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        memory: 128Mi

  # kube-state-metrics on dip-ce-k3s-eu was OOM-thrashing at its 38Mi limit
  # (working set pinned at ~37Mi -> liveness/readiness timeouts and restarts).
  # Bumped to give headroom for the current cluster size (130+ pods, 150+ secrets).
  kube-state-metrics:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

  nodeExporter:
    enabled: true

  prometheus-node-exporter:
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 32Mi
    prometheus:
      monitor:
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: instance
        metricRelabelings:
          - sourceLabels: [instance]
            targetLabel: nodename
