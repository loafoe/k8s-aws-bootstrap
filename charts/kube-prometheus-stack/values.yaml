kube-prometheus-stack:
  fullnameOverride: kps

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 128Mi

  prometheus:
    prometheusSpec:
      enableOTLPReceiver: true
      # Discover ServiceMonitors/PodMonitors/Rules/Probes/ScrapeConfigs across all
      # namespaces without requiring the `release: kps` label. Setting these to false
      # makes a nil selector mean "match everything" (matches our EKS clusters).
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      # Prometheus was OOMKilled (exit 137) on dip-ce-k3s-eu, 247 restarts in
      # 30h. Cause: WAL replay is a startup-time memory spike. The TSDB lives on
      # an emptyDir, so every pod recreate replays the WAL from segment 0; with
      # 262 segments accumulated the replay needs more than the 2100Mi limit, so
      # the container died before finishing replay, restarted, and replayed the
      # same WAL again -- a self-sustaining OOM loop that only broke once the
      # emptyDir was recreated empty.
      #
      # 3Gi gives the replay spike headroom while keeping steady-state usage
      # (~1.3Gi at 448k series) well inside the limit. Only the *limit* moves:
      # the request stays at 1Gi because this node is already at 93% of its
      # memory-request budget, and raising the request would make the pod
      # unschedulable. Limits do not participate in scheduling.
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 3Gi

  prometheusOperator:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        memory: 128Mi

  # kube-state-metrics on dip-ce-k3s-eu was OOM-thrashing at its 38Mi limit
  # (working set pinned at ~37Mi -> liveness/readiness timeouts and restarts).
  # Bumped to give headroom for the current cluster size (130+ pods, 150+ secrets).
  kube-state-metrics:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

  nodeExporter:
    enabled: true

  prometheus-node-exporter:
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 32Mi
    prometheus:
      monitor:
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: instance
        metricRelabelings:
          - sourceLabels: [instance]
            targetLabel: nodename
