kube-prometheus-stack:
  fullnameOverride: kps

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 128Mi

  prometheus:
    prometheusSpec:
      enableOTLPReceiver: true
      # Discover ServiceMonitors/PodMonitors/Rules/Probes/ScrapeConfigs across all
      # namespaces without requiring the `release: kps` label. Setting these to false
      # makes a nil selector mean "match everything" (matches our EKS clusters).
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 2100Mi

  prometheusOperator:
    resources:
      requests:
        cpu: 5m
        memory: 25Mi
      limits:
        memory: 50Mi

  # kube-state-metrics on dip-ce-k3s-eu was OOM-thrashing at its 38Mi limit
  # (working set pinned at ~37Mi -> liveness/readiness timeouts and restarts).
  # Bumped to give headroom for the current cluster size (130+ pods, 150+ secrets).
  kube-state-metrics:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

  nodeExporter:
    enabled: true

  prometheus-node-exporter:
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 32Mi
    prometheus:
      monitor:
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: instance
        metricRelabelings:
          - sourceLabels: [instance]
            targetLabel: nodename
