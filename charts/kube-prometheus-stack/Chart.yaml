apiVersion: v2
name: kube-prometheus-stack
version: 0.1.24
description: Thin wrapper for kube-prometheus-stack
dependencies:
  - name: kube-prometheus-stack
    # renovate: datasource=helm registryUrl=https://prometheus-community.github.io/helm-charts depName=kube-prometheus-stack
    # Held at 92.x on purpose: 93.0.0+ ships prometheus-operator v0.95.1, whose
    # published image index only carries linux/amd64, so arm64 nodes fail to pull
    # the operator. 92.22.0 is the newest release still on v0.94.2 (multi-arch).
    # Renovate is blocked from crossing 93.0.0 in .github/renovate-config.js;
    # drop that rule once the upstream fix lands:
    # https://github.com/prometheus-operator/prometheus-operator/issues/8953
    version: "92.22.0"
    repository: "https://prometheus-community.github.io/helm-charts"
