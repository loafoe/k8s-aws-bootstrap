project: "default"

# Feature flags for optional components
features:
  # Gateway API overlay components
  gatewayApi:
    enabled: true
    sharedGateway:
      enabled: true
    httproutes:
      argocd: true
      grafana: false
  
  # HSP AWS Platform overlay components
  hspAwsPlatform:
    enabled: true
    cloudnativePg:
      enabled: false
    ecrPullThrough:
      enabled: true
    hspAddons:
      enabled: true
    vpa:
      enabled: true

  # SPIFFE/SPIRE for workload identity
  spiffe:
    enabled: true
    # Trust domain for SPIFFE identities (auto-derived from clusterFqdn if empty)
    trustDomain: ""
    federation:
      enabled: true
    oidcDiscovery:
      enabled: true

  # Kube Prometheus Stack
  kubePrometheusStack:
    enabled: true
    grafana:
      enabled: false
    # Empty = use the kube-prometheus-stack chart defaults (14d / 40GB / 50Gi).
    # Set any of these to override per cluster from the Argo CD UI.
    prometheus:
      retention: ""
      retentionSize: ""
      storageSize: ""

  # Descheduler for pod rebalancing
  descheduler:
    enabled: true

  # Optional Kyverno guardrails, off by default. Enable per cluster.
  kyverno:
    requireImageDigest:
      enabled: false
    # Explicit, reviewable carve-outs from the Zero Trust RBAC policies
    # (restrict-wildcard-rbac, restrict-escalation-verbs) for platform
    # infrastructure that legitimately needs cluster-wide reconcile rights.
    # See docs/argocd-rbac-exemption.md for the recorded risk acceptance.
    rbacExemptions:
      argoCD:
        enabled: true
        # Namespaces Argo CD's own namespaced Roles live in. A Role here is
        # exempt only if its name ALSO matches clusterRolePrefixes below —
        # this namespace is not a blanket exemption for every Role in it.
        namespaces: ["argocd"]
        # Name prefixes of Argo CD's own ClusterRoles/Roles. ClusterRoles
        # have no namespace, so this prefix match is their only gate.
        clusterRolePrefixes: ["argocd-", "argocd:"]

  # Shutdown mode
  shutdown:
    enabled: false
    image: "alpine/k8s:1.35.0"

environmentConfig:
  # Top-level config
  sharedServicesAccountId: ""
  
  bootstrap:
    # Core identifiers
    resourcePrefix: ""
    awsAccountId: ""
    awsPartition: "aws"
    awsRegion: ""
    
    # Cluster info
    clusterName: ""
    clusterFqdn: ""
    additionalClusterFqdns: []
    clusterHost: ""
    clusterEndpoint: ""
    
    # OIDC
    oidcProvider: ""
    oidcProviderArn: ""
    
    # VPC
    awsVpcId: ""
    awsPrivateSubnetIds: ""
    
    # IAM Role ARNs
    awsLbcRoleArn: ""
    awsEbsCsiDriverRoleArn: ""
    awsExternalDnsRoleArn: ""
    certManagerRoleArn: ""
    karpenterRoleArn: ""
    crossplaneProviderAwsIamRoleArn: ""
    
    # Karpenter
    karpenterInstanceProfile: ""
    karpenterInterruptionQueueName: ""
    
    # K3S (for EC2NodeClass)
    k3sTokenParameterName: ""
    k3sVersionParameterName: ""
    k3sVersion: ""
    k3sChannel: ""
    
    # Subnet Groups (JSON strings)
    awsRdsSubnetGroup: ""
    awsRedshiftSubnetGroup: ""
    awsElasticacheSubnetGroup: ""
    
    # Security Groups (JSON strings)
    awsRdsSecurityGroups: ""
    awsRedshiftSecurityGroups: ""
    awsElasticacheSecurityGroups: ""
    awsActivemqSecurityGroups: ""
