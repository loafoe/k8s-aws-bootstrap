project: "default"

# Feature flags for optional components
features:
  # Gateway API overlay components
  gatewayApi:
    enabled: true
    sharedGateway:
      enabled: true
    httproutes:
      argocd: true
      grafana: false
  
  # HSP AWS Platform overlay components
  hspAwsPlatform:
    enabled: true
    cloudnativePg:
      enabled: false
    ecrPullThrough:
      enabled: true
    hspAddons:
      enabled: true
    vpa:
      enabled: true

  # SPIFFE/SPIRE for workload identity
  spiffe:
    enabled: true
    # Trust domain for SPIFFE identities (auto-derived from clusterFqdn if empty)
    trustDomain: ""
    federation:
      enabled: true
    oidcDiscovery:
      enabled: true

  # Kube Prometheus Stack
  kubePrometheusStack:
    enabled: true
    grafana:
      enabled: false
    # Empty = use the kube-prometheus-stack chart defaults (14d / 40GB / 50Gi).
    # Set any of these to override per cluster from the Argo CD UI.
    prometheus:
      retention: ""
      retentionSize: ""
      storageSize: ""

  # Descheduler for pod rebalancing
  descheduler:
    enabled: true

  # Optional Kyverno guardrails, off by default. Enable per cluster.
  kyverno:
    requireImageDigest:
      enabled: false

  # Shutdown mode
  shutdown:
    enabled: false
    image: "alpine/k8s:1.35.0"

environmentConfig:
  # Top-level config
  sharedServicesAccountId: ""
  # Ownership metadata used by chart-managed workloads to satisfy the
  # require-owner-label Kyverno policy.
  owner: ""
  managedBy: ""
  
  bootstrap:
    # Core identifiers
    resourcePrefix: ""
    owner: ""
    managedBy: ""
    awsAccountId: ""
    awsPartition: "aws"
    awsRegion: ""
    
    # Cluster info
    clusterName: ""
    clusterFqdn: ""
    additionalClusterFqdns: []
    clusterHost: ""
    clusterEndpoint: ""
    
    # OIDC
    oidcProvider: ""
    oidcProviderArn: ""
    
    # VPC
    awsVpcId: ""
    awsPrivateSubnetIds: ""
    
    # IAM Role ARNs
    awsLbcRoleArn: ""
    awsEbsCsiDriverRoleArn: ""
    awsExternalDnsRoleArn: ""
    certManagerRoleArn: ""
    karpenterRoleArn: ""
    crossplaneProviderAwsIamRoleArn: ""
    
    # Karpenter
    karpenterInstanceProfile: ""
    karpenterInterruptionQueueName: ""
    
    # K3S (for EC2NodeClass)
    k3sTokenParameterName: ""
    k3sVersionParameterName: ""
    k3sVersion: ""
    k3sChannel: ""
    
    # Subnet Groups (JSON strings)
    awsRdsSubnetGroup: ""
    awsRedshiftSubnetGroup: ""
    awsElasticacheSubnetGroup: ""
    
    # Security Groups (JSON strings)
    awsRdsSecurityGroups: ""
    awsRedshiftSecurityGroups: ""
    awsElasticacheSecurityGroups: ""
    awsActivemqSecurityGroups: ""
