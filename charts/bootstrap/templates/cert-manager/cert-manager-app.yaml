apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # Wave 0, so the CRDs and the webhook exist before wave 1 applies the ClusterIssuers
    # and the crossplane PKI. At wave 1 those three resources were applied in the *same*
    # wave as this Application, i.e. concurrently with the very install that creates the
    # cert-manager.io kinds -- and on a fresh cluster that failed: "no matches for kind
    # Certificate in version cert-manager.io/v1", sync failed, retry from wave -10.
    # SkipDryRunOnMissingResource did not help; it only defers the failure from validate
    # to apply, and the apply has the same problem. Nothing at wave 0 needs cert-manager,
    # and CreateNamespace below makes the namespace.
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/manifest-generate-paths: /charts/cert-manager
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/cert-manager
    targetRevision: cert-manager-v1.21.3-0.1.2
    helm:
      valuesObject:
        cert-manager:
          global:
            commonLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          podLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          cainjector:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          webhook:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          startupapicheck:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: {{ .Values.environmentConfig.bootstrap.certManagerRoleArn }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  ignoreDifferences:
    - group: apps
      jsonPointers:
        - /spec/replicas
      kind: Deployment
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
