apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    # Wave 2, not 3: its NodePools and EC2NodeClass (wave 4) are this chart's own
    # karpenter.sh / karpenter.k8s.aws CRs, and they only have one wave of slack. The
    # parent gates a wave on a child Application's health, and a fresh child reports
    # Healthy with no status, so wave 4 arrived before this Application had installed its
    # CRDs and the NodePools failed with `no matches for kind` (fleet10, 2026-11-25). They
    # cannot move later: kyverno (wave 5) is pinned to node-type=system, which only the
    # system NodePool below creates, so the pool has to stay ahead of it. Moving this
    # Application up is the fix that does not starve kyverno.
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/manifest-generate-paths: /charts/karpenter
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/karpenter
    targetRevision: karpenter-1.15.3-0.1.8
    helm:
      valuesObject:
        karpenter:
          additionalLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          podLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          settings:
            clusterName: {{ .Values.environmentConfig.bootstrap.clusterName }}
            {{- if include "bootstrap.isK3s" . }}{{/* EKS: Karpenter looks the endpoint up itself */}}
            clusterEndpoint: {{ .Values.environmentConfig.bootstrap.clusterEndpoint }}
            {{- end }}
            interruptionQueue: {{ .Values.environmentConfig.bootstrap.karpenterInterruptionQueueName }}
            # Upstream default is 1m (the minimum allowed). Each refresh tick drives the
            # EC2NodeClass controller's status-validation reconcile, which creates a
            # throwaway EC2 Launch Template to confirm the AMI/subnet/SG selectors still
            # resolve, then deletes it ~1min later via an internal cache TTL - independent
            # of any actual node launch. At 1m this produced ~50 create+delete cycles/day
            # with zero node churn, and every deletion leaves a permanent, never-archived
            # NOT_APPLICABLE finding in the OrgConfigRule-ec2-launch*-ebs-*encrypted*
            # Security Hub checks (7,688 such ghost findings as of 2026-11-14, 0 of them
            # actually non-compliant - this account's root EBS volume has been
            # encrypted: true since this EC2NodeClass template was created). 10m is still
            # far more responsive than real AMI/subnet/SG change cadence.
            amiRefreshInterval: 10m
            subnetRefreshInterval: 10m
            securityGroupRefreshInterval: 10m
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: {{ .Values.environmentConfig.bootstrap.karpenterRoleArn }}
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
      # Its ServiceMonitor needs the monitoring.coreos.com CRD, which only exists once
      # kube-prometheus-stack (sync-wave 16) has synced; this is wave 2.
      - SkipDryRunOnMissingResource=true
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
