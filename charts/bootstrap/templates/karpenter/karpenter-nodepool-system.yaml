apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: system
  namespace: karpenter
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Template for system node provisioning
  template:
    metadata:
      labels:
        intent: system
        node-type: "system"
        cluster: "{{ .Values.environmentConfig.bootstrap.clusterName }}"
        # Mirrors the master's node-role.kubernetes.io/control-plane label so
        # `kubectl get nodes` ROLES shows "worker" instead of <none>.
        node-role.kubernetes.io/worker: "true"
    spec:
      # Reference to EC2NodeClass (reuse default)
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
        
      # Taint for CriticalAddOnsOnly workloads
      taints:
        - key: CriticalAddonsOnly
          value: "true"
          effect: NoSchedule
          
      # Node requirements for system workloads
      requirements:
        # Architecture: prefer ARM64, allow AMD64 as fallback
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]

        # Prefer on-demand for stability, allow spot as fallback
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
          
        # Instance categories suitable for system workloads
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
          
        # Modern instance generations (4+ for ARM64 support)
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
          
        # Size limits for system nodes
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large", "xlarge"]

        # Ensure sufficient memory capacity per node (> 6GB forces t4g.large minimum)
        - key: karpenter.k8s.aws/instance-memory
          operator: Gt
          values: ["6000"]

        # Ensure sufficient CPU capacity per node (>= 2 vCPU)
        - key: karpenter.k8s.aws/instance-cpu
          operator: Gt
          values: ["1"]

      # Startup taints for K3s initialization
      startupTaints:
        - key: karpenter.sh/unregistered
          value: "true"
          effect: NoExecute
        # Registered by the kubelet in _k3s-userdata.tpl and lifted by cilium-operator once the
        # node's Cilium agent is ready. Declared here so Karpenter treats it as transient: without
        # it, Karpenter counted every new node as one pending pods can never tolerate and kept
        # launching more during the ~1-2 min Cilium start-up (2 -> 14 workers on one drift roll
        # of fleet11, 2026-11-26).
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoSchedule
          
      # Node expiration for security and cost management
      expireAfter: 360h # 15 days
      
      # Termination grace period
      terminationGracePeriod: 10m
      
  # Resource limits for system nodes
  limits:
    cpu: {{ if .Values.features.shutdown.enabled -}} "0" {{- else -}} "50" {{- end }}
    memory: "200Gi"
    
  # Disruption settings for system node lifecycle management
  disruption:
    # Consolidate when nodes are empty or underutilized
    consolidationPolicy: WhenEmptyOrUnderutilized
    
    # Wait time before consolidation
    # 5m: matches the default pool. The 1-node budget below is what actually keeps
    # system-pool churn bounded (one disruption at a time), so this does not need to
    # be the longer, "for stability" value it used to be.
    consolidateAfter: 5m
    
    # Budget controls for disruption rate limiting
    budgets:
      # Allow only 1 node to be disrupted at once for system stability
      - nodes: "1"
      
      # Maintenance window: relax disruption during business hours (UTC) to allow consolidation
      - schedule: "0 9 * * mon-fri"
        duration: 8h
        nodes: "1"
        
  # Weight for NodePool selection (lower than default to prefer default pool for regular workloads)
  weight: 5
