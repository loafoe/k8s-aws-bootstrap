{{- /* k3s only: the workers join the k3s master (an EKS cluster needs its own EC2NodeClass) */ -}}
{{- if include "bootstrap.isK3s" . -}}
{{- $nodeOs := include "bootstrap.nodeOs" . -}}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  namespace: karpenter
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Injected from EnvironmentConfig for drift detection
    k8s-aws-bootstrap.io/k3s-version: "{{ .Values.environmentConfig.bootstrap.k3sVersion }}"
spec:
  # Amazon Linux (nodeOs): AL2023, or AL2027 (preview AMI names until its GA)
  # Using the Custom AMI family with name-based AMI selection
  amiFamily: Custom
  
  # Full (not minimal) Amazon Linux AMIs for K3s, both x86_64 and ARM64
  amiSelectorTerms:
    {{- if eq $nodeOs "al2027" }}
    - name: "al2027-preview-ami-2027.*-kernel-*-x86_64"
      owner: "137112412989" # Amazon
    - name: "al2027-preview-ami-2027.*-kernel-*-arm64"
      owner: "137112412989" # Amazon
    {{- else }}
    - name: "al2023-ami-2023.*-kernel-*-x86_64"
      owner: "137112412989" # Amazon
    - name: "al2023-ami-2023.*-kernel-*-arm64"
      owner: "137112412989" # Amazon
    {{- end }}
        
  # Instance profile (pre-created for K3s)
  instanceProfile: {{ .Values.environmentConfig.bootstrap.karpenterInstanceProfile }}
  
  # Subnet selection - use karpenter discovery tags to avoid kubernetes.io restrictions
  subnetSelectorTerms:
    # Select by karpenter discovery tag only
    - tags:
        karpenter.sh/discovery/{{ .Values.environmentConfig.bootstrap.clusterName }}: "{{ .Values.environmentConfig.bootstrap.clusterName }}"
  # Security group selection  
  securityGroupSelectorTerms:
    # Select by karpenter discovery tag (more specific)
    - tags:
        karpenter.sh/discovery/{{ .Values.environmentConfig.bootstrap.clusterName }}: "{{ .Values.environmentConfig.bootstrap.clusterName }}"
        
  # Custom UserData for K3s node joining
  userData: |{{ include "bootstrap.karpenter.k3sUserData" . }}
    
  # Block device mapping for Amazon Linux 2023
  blockDeviceMappings:
    - deviceName: /dev/xvda
      rootVolume: true
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
        
  # Additional tags
  tags:
    Name: "{{ .Values.environmentConfig.bootstrap.clusterName }}-karpenter-node"
    ManagedBy: "karpenter"
    Environment: "production"
    
  # Instance metadata options
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
{{- end }}
