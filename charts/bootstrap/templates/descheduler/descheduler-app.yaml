{{- if .Values.features.descheduler.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: descheduler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "21"
    argocd.argoproj.io/manifest-generate-paths: /charts/descheduler
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/descheduler
    targetRevision: descheduler-0.1.3
    helm:
      # values, not valuesObject: the Application CRD drops nulls from valuesObject (a permanent
      # diff, and Helm never sees the null). The null deletes the upstream chart's 500m CPU
      # limit; Helm honours it only from a values overlay, not from charts/descheduler's own
      # values.yaml.
      values: |
        descheduler:
          commonLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          podLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          resources:
            limits:
              cpu: null
  destination:
    server: https://kubernetes.default.svc
    namespace: descheduler

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
{{- end }}
