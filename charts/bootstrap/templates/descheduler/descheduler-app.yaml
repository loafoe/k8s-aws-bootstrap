{{- if .Values.features.descheduler.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: descheduler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "21"
    argocd.argoproj.io/manifest-generate-paths: /charts/descheduler
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/descheduler
    targetRevision: HEAD
    helm:
      valuesObject:
        descheduler:
          commonLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          podLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          # Upstream chart defaults resources.limits.cpu to 500m; null here is required
          # to actually delete the inherited key (overriding it in charts/descheduler's
          # own values.yaml has no effect, since Helm only honors null-deletion for an
          # externally supplied values overlay, not a chart's own bundled defaults).
          resources:
            limits:
              cpu: null
  destination:
    server: https://kubernetes.default.svc
    namespace: descheduler

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
{{- end }}
