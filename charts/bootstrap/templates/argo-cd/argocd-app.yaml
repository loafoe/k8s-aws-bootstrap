apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
    argocd.argoproj.io/manifest-generate-paths: /charts/argocd
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/argocd
    targetRevision: argocd-10.20.0-0.1.22
    helm:
      valuesObject:
        argo-cd:
          global:
            additionalLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
            deploymentLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
            statefulsetLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
            domain: "argocd.{{ .Values.environmentConfig.bootstrap.clusterFqdn }}"
          configs:
            cm:
              ui.bannercontent: "Account ID: {{ .Values.environmentConfig.bootstrap.awsAccountId }} | Region: {{ .Values.environmentConfig.bootstrap.awsRegion }} | Cluster: {{ .Values.environmentConfig.bootstrap.clusterName }}"
              ui.bannerpermanent: "true"
          # The argo-cd chart defaults redis (and redis-ha/haproxy) to
          # ecr-public.aws.com/docker/library/redis. That host resolves and serves, but it
          # is not the documented public-ECR hostname -- public.ecr.aws is -- and, more
          # usefully, it is not the host the ECR pull-through `ecr-public` alias covers.
          # Pointing at public.ecr.aws puts redis through the cache like every other
          # registry we pull from. Only `redis` matters today: redis-ha is disabled, so
          # its image and haproxy never render.
          redis:
            image:
              repository: public.ecr.aws/docker/library/redis
          server:
            config:
              url: "https://argocd.{{ .Values.environmentConfig.bootstrap.clusterFqdn }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  revisionHistoryLimit: 3
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    jsonPointers:
    - /metadata/finalizers
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
