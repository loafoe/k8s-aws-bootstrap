apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
    argocd.argoproj.io/manifest-generate-paths: /charts/argocd
spec:
  project: default
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/argocd
    targetRevision: HEAD
    helm:
      valuesObject:
        argo-cd:
          global:
            additionalLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
            deploymentLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
            statefulsetLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
            domain: "argocd.{{ .Values.environmentConfig.bootstrap.clusterFqdn }}"
          configs:
            cm:
              ui.bannercontent: "Account ID: {{ .Values.environmentConfig.bootstrap.awsAccountId }} | Region: {{ .Values.environmentConfig.bootstrap.awsRegion }} | Cluster: {{ .Values.environmentConfig.bootstrap.clusterName }}"
              ui.bannerpermanent: "true"
          server:
            config:
              url: "https://argocd.{{ .Values.environmentConfig.bootstrap.clusterFqdn }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  revisionHistoryLimit: 3
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    jsonPointers:
    - /metadata/finalizers
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
