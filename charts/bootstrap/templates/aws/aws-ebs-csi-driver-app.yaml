apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-ebs-csi-driver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    argocd.argoproj.io/manifest-generate-paths: /charts/aws-ebs-csi-driver
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/aws-ebs-csi-driver
    targetRevision: aws-ebs-csi-driver-2.68.1-0.1.7
    helm:
      valuesObject:
        aws-ebs-csi-driver:
          customLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          controller:
            # Every volume and snapshot the driver creates gets kubernetes.io/cluster/<cluster>=owned
            # (and KubernetesCluster=<cluster>): k3s-on-ec2's destroy cleanup finds PVC volumes by
            # that tag, including ones no instance has attached any more
            k8sTagClusterId: {{ .Values.environmentConfig.bootstrap.clusterName }}
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
            serviceAccount:
              annotations:
                eks.amazonaws.com/role-arn: {{ .Values.environmentConfig.bootstrap.awsEbsCsiDriverRoleArn }}
          node:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
            # Kubernetes API first (providerID + instance-type/region/zone node labels), IMDS only
            # as the fallback. Karpenter nodes carry all of those and run with an IMDS hop limit
            # of 1 (karpenter-ec2nodeclass.yaml), which a pod cannot reach; the upstream default
            # (imds,kubernetes) would try IMDS first and then keep re-reading the ENI count from
            # it several times a minute. The k3s master has no topology.kubernetes.io/region label and
            # instance-type "k3s", so there the Kubernetes source fails and it falls back to IMDS
            # as before.
            metadataSources: "kubernetes,imds"
  destination:
    server: https://kubernetes.default.svc
    namespace: aws-ebs-csi-driver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
