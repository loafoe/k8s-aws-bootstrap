apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    # Wave 8, one wave after the ECR pull-through MutatingPolicy (7): the policy
    # rewrites image references to this account's pull-through cache, so an app that
    # syncs before it exists pulls straight from upstream. On fleet01 (2026-11-24)
    # both of these apps sat at wave 6 and ran public.ecr.aws / registry.k8s.io
    # images, while everything from wave 7 on came from 124355645143.dkr.ecr.
    # Nothing consumes the ALB controller before the Gateway at wave 13.
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/manifest-generate-paths: /charts/aws-load-balancer-controller
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/aws-load-balancer-controller
    targetRevision: aws-load-balancer-controller-3.6.3-0.1.5
    helm:
      valuesObject:
        aws-load-balancer-controller:
          clusterName: {{ .Values.environmentConfig.bootstrap.clusterName }}
          region: {{ .Values.environmentConfig.bootstrap.awsRegion }}
          vpcId: {{ .Values.environmentConfig.bootstrap.awsVpcId }}
          additionalLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          podLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: {{ .Values.environmentConfig.bootstrap.awsLbcRoleArn }}  
  destination:
    server: https://kubernetes.default.svc
    namespace: aws-load-balancer-controller
  # caBundle is injected by cert-manager's cainjector (enableCertManager)
  # Webhook caBundle is injected by cert-manager's cainjector (enableCertManager)
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
      - RespectIgnoreDifferences=true
      # The chart's cert-manager Issuer/Certificate: on a fresh cluster cert-manager's
      # CRDs may not be served yet when this app first syncs
      - SkipDryRunOnMissingResource=true
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
