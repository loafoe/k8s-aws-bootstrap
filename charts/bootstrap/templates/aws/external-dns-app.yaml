apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    # Wave 8, one wave after the ECR pull-through MutatingPolicy (7): the policy
    # rewrites image references to this account's pull-through cache, so an app that
    # syncs before it exists pulls straight from upstream. On fleet01 (2026-11-24)
    # both of these apps sat at wave 6 and ran public.ecr.aws / registry.k8s.io
    # images, while everything from wave 7 on came from 124355645143.dkr.ecr.
    # Nothing consumes the ALB controller before the Gateway at wave 13.
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/manifest-generate-paths: /charts/external-dns
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/external-dns
    targetRevision: external-dns-1.24.0-0.1.2
    helm:
      valuesObject:
        external-dns:
          commonLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          podLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: {{ .Values.environmentConfig.bootstrap.awsExternalDnsRoleArn }}
          domainFilters:
            - {{ .Values.environmentConfig.bootstrap.clusterFqdn }}
            {{- range .Values.environmentConfig.bootstrap.additionalClusterFqdns }}
            - {{ . }}
            {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
