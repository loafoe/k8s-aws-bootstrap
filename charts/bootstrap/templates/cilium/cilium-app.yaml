apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/manifest-generate-paths: /charts/cilium
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/cilium
    targetRevision: cilium-1.20.5-0.1.5
    helm:
      valuesObject:
        cilium:
          commonLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          # IPAM Configuration
          ipam:
            {{- if .Values.environmentConfig.bootstrap.enableDualStack }}
            mode: cluster-pool
            operator:
              clusterPoolIPv4PodCIDRList:
                - "{{ .Values.environmentConfig.bootstrap.ipv4ClusterCIDR }}"
              clusterPoolIPv4MaskSize: 24
              clusterPoolIPv6PodCIDRList:
                - "{{ .Values.environmentConfig.bootstrap.ipv6ClusterCIDR }}"
              clusterPoolIPv6MaskSize: 64
            {{- else }}
            mode: kubernetes
            operator:
              clusterPoolIPv4PodCIDRList:
                - "{{ .Values.environmentConfig.bootstrap.ipv4ClusterCIDR }}"
            {{- end }}

          # API Server Configuration
          k8sServiceHost: "{{ .Values.environmentConfig.bootstrap.clusterHost }}"

          # IPv4/IPv6 Configuration
          {{- if .Values.environmentConfig.bootstrap.enableDualStack }}
          ipv4:
            enabled: true
          ipv6:
            enabled: true
          enableIPv4Masquerade: true
          enableIPv6Masquerade: true
          {{- else }}
          ipv4:
            enabled: true
          ipv6:
            enabled: false
          enableIPv4Masquerade: true
          {{- end }}

          # The cilium chart's validate.yaml hard-fails the helm render when any
          # ServiceMonitor is enabled and .Capabilities.APIVersions lacks
          # monitoring.coreos.com/v1 -- and Argo CD passes the cluster's live API versions
          # to `helm template`. On a fresh cluster that CRD only exists once
          # kube-prometheus-stack (wave 16) has synced, so this app could not render at
          # all until then: no manifests, no operator rollout, no GatewayClass, and any
          # Gateway sat at Accepted/Programmed "Waiting for controller".
          # SkipDryRunOnMissingResource cannot help -- it acts on apply, and there was
          # nothing to apply. Observed on a fresh devcloud 2026-11-24, where it deadlocked
          # the bootstrap: cilium needed wave 16 to render, wave 16 needed the Gateway at
          # wave 13 to be healthy, and the Gateway needed cilium's GatewayClass.
          # The chart's own escape hatch keeps the ServiceMonitors; applying them simply
          # fails until wave 16, which the app-level SkipDryRunOnMissingResource and the
          # unlimited retry below already cover.
          prometheus:
            serviceMonitor:
              trustCRDsExist: true

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-relay-client-certs
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - HealthCheckTimeout=10m
      # ServiceMonitors here need the monitoring.coreos.com CRD, which only exists once
      # kube-prometheus-stack (sync-wave 16) has synced; this is wave 0.
      - SkipDryRunOnMissingResource=true
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
