apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/manifest-generate-paths: /charts/cilium
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/cilium
    targetRevision: cilium-1.20.5-0.1.7
    helm:
      valuesObject:
        cilium:
          commonLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          # IPAM Configuration
          ipam:
            {{- if .Values.environmentConfig.bootstrap.enableDualStack }}
            mode: cluster-pool
            operator:
              clusterPoolIPv4PodCIDRList:
                - "{{ .Values.environmentConfig.bootstrap.ipv4ClusterCIDR }}"
              clusterPoolIPv4MaskSize: 24
              clusterPoolIPv6PodCIDRList:
                - "{{ .Values.environmentConfig.bootstrap.ipv6ClusterCIDR }}"
              clusterPoolIPv6MaskSize: 64
            {{- else }}
            mode: kubernetes
            operator:
              clusterPoolIPv4PodCIDRList:
                - "{{ .Values.environmentConfig.bootstrap.ipv4ClusterCIDR }}"
            {{- end }}

          # API Server Configuration
          k8sServiceHost: "{{ .Values.environmentConfig.bootstrap.clusterHost }}"

          # IPv4/IPv6 Configuration
          {{- if .Values.environmentConfig.bootstrap.enableDualStack }}
          ipv4:
            enabled: true
          ipv6:
            enabled: true
          enableIPv4Masquerade: true
          enableIPv6Masquerade: true
          {{- else }}
          ipv4:
            enabled: true
          ipv6:
            enabled: false
          enableIPv4Masquerade: true
          {{- end }}

          # Upstream defaults operator.replicas to 2, and upstream also defaults
          # operator.hostNetwork to true -- which gives the operator hostPort
          # 9234/9963, i.e. one operator pod per node by construction. With the
          # chart's nodeAffinity restricting it to node-type system/control-plane, a
          # fresh cluster has exactly one eligible node (the master), so the second
          # replica is permanently Pending. The cilium Application then sits Degraded,
          # wave 0 never completes, Karpenter (wave 3) never runs, no system node is
          # ever created, and the loop closes -- measured on a fresh devcloud
          # 2026-11-24 09:14: operator 2 desired / 1 available, second pod
          # "0/1 nodes are available: 1 node(s) didn't have free ports".
          # 1 is also what the chart expects: it sets maxUnavailable: 100% for a
          # single-replica RollingUpdate precisely so the old pod releases the hostPort
          # before the new one starts, which the replicas: 2 branch does not do.
          # Matches resources/kustomize/cilium-values.yaml in k3s-on-ec2, which the
          # master boots with.
          operator:
            replicas: 1

          # The cilium chart's validate.yaml hard-fails the helm render when any
          # ServiceMonitor is enabled and .Capabilities.APIVersions lacks
          # monitoring.coreos.com/v1 -- and Argo CD passes the cluster's live API versions
          # to `helm template`. Before 2026-11-26 that CRD only arrived with
          # kube-prometheus-stack (wave 16), so this app could not render at all: no
          # manifests, no operator rollout, no GatewayClass, and any Gateway sat at
          # Accepted/Programmed "Waiting for controller" (fresh devcloud 2026-11-24, where
          # that deadlocked the bootstrap).
          # Now the CRDs come from the `prometheus-operator-crds` Application at wave -5, so
          # the real CRD is there when this renders. trustCRDsExist stays as the chart's own
          # escape hatch: it keeps the monitors in the render if the CRD app is ever disabled
          # (features.kubePrometheusStack.enabled=false), where they would otherwise fail the
          # whole render instead of just their own apply.
          prometheus:
            serviceMonitor:
              trustCRDsExist: true

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-relay-client-certs
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - HealthCheckTimeout=10m
      # ServiceMonitors here need the monitoring.coreos.com CRD, which arrives with the
      # prometheus-operator-crds Application at wave -5 -- before this app, by design.
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
