{{- if .Values.features.kubePrometheusStack.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    argocd.argoproj.io/manifest-generate-paths: /charts/kube-prometheus-stack
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/kube-prometheus-stack
    targetRevision: HEAD
    helm:
      releaseName: kps
      valuesObject:
        kube-prometheus-stack:
          grafana:
            enabled: {{ .Values.features.kubePrometheusStack.grafana.enabled }}
{{- $prometheus := .Values.features.kubePrometheusStack.prometheus }}
{{- if or $prometheus.retention $prometheus.retentionSize $prometheus.storageSize }}
          prometheus:
            prometheusSpec:
{{- if $prometheus.retention }}
              retention: {{ $prometheus.retention | quote }}
{{- end }}
{{- if $prometheus.retentionSize }}
              retentionSize: {{ $prometheus.retentionSize | quote }}
{{- end }}
{{- if $prometheus.storageSize }}
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    resources:
                      requests:
                        storage: {{ $prometheus.storageSize | quote }}
{{- end }}
{{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  ignoreDifferences:
    - group: monitoring.coreos.com
      kind: ServiceMonitor
      jqPathExpressions:
        - .spec.endpoints[]?.relabelings[]?.action
        - .spec.endpoints[]?.metricRelabelings[]?.action
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
{{- end }}
