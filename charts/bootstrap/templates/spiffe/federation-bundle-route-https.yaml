{{- if and .Values.features.spiffe.enabled .Values.features.spiffe.federation.enabled .Values.features.gatewayApi.enabled .Values.features.gatewayApi.sharedGateway.enabled (not .Values.features.shutdown.enabled) }}
# Separate Service (same pods/port as the spire-server "federation" port) so the
# HTTPRoute backendRef doesn't share a Cluster name with the existing TLSRoute's
# backendRef. Cilium's Gateway translator names Envoy clusters by
# "<namespace>:<service>:<port>" and rejects the whole CiliumEnvoyConfig with
# "duplicate Cluster name" if a TLSRoute and an HTTPRoute both target
# spire-server:8443 directly.
apiVersion: v1
kind: Service
metadata:
  name: spire-server-federation-bundle
  namespace: spire-system
  annotations:
    argocd.argoproj.io/sync-wave: "19"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    app.kubernetes.io/instance: spire
    app.kubernetes.io/name: server
  ports:
    - name: https
      port: 8443
      targetPort: federation
      protocol: TCP
---
# CA bundle for BackendTLSPolicy validation below. Cilium 1.20.x/1.21.x accepts
# `wellKnownCACertificates: System` but silently produces a plaintext upstream
# instead of validating against the system trust store (cilium/cilium#48307).
# The bundle endpoint's cert is issued by letsencrypt-prod (see
# federation-certificate.yaml), so pinning ISRG Root X1 here is the workaround.
