kind: ConfigMap
metadata:
  name: spire-federation-bundle-ca
  namespace: spire-system
  annotations:
    argocd.argoproj.io/sync-wave: "19"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
