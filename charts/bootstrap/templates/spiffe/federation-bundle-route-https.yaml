apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: spire-server-federation-bundle
  namespace: spire-system
  annotations:
    argocd.argoproj.io/sync-wave: "19"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: spire-server-federation-bundle
      sectionName: https
  validation:
    hostname: spiffe.{{ .Values.environmentConfig.bootstrap.clusterFqdn }}
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: spire-federation-bundle-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spiffe-federation-bundle-https
  namespace: spire-system
  annotations:
    argocd.argoproj.io/sync-wave: "19"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
  hostnames:
    - spiffe.{{ .Values.environmentConfig.bootstrap.clusterFqdn }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: spire-server-federation-bundle
          port: 8443
{{- end }}
