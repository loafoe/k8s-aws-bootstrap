apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    # Wave 5, not 3: every kyverno controller (and the chart's pre-install
    # check-legacy-policies hook, which blocks the whole app) is pinned to
    # node-type=system, and that pool's nodes only exist once the NodePools at
    # wave 4 have been applied and Karpenter has launched and joined them (~2-3
    # min). At wave 3 the app sat with nothing applied for 7.5 minutes on
    # fleet00 (2026-11-24): the hook's 120s activeDeadlineSeconds failed twice
    # while its pod waited for a system node, so no CRDs existed until 16:19:50
    # -- which is what made the kyverno policies (wave 6) fail `no matches for kind`
    # and forced a whole-sync retry. Wave 5 is reached ~6 min after wave 4
    # starts, which is enough for the system nodes to be Ready.
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/manifest-generate-paths: /charts/kyverno
spec:
  destination:
    namespace: kyverno
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/kyverno
    targetRevision: kyverno-3.10.0-0.1.4
    helm:
      valuesObject:
        kyverno:
          # Pull every kyverno image from ghcr instead of the chart's default
          # reg.kyverno.io. On 2026-11-24 reg.kyverno.io answered 503/502/timeout and
          # there is no ECR pull-through rule for it, so a bootstrap stalled at the
          # chart's pre-install hook: `kyverno-check-legacy-policies` could not pull
          # reg.kyverno.io/kyverno/kyverno-cli:v1.20.0. A pre-install hook that cannot
          # pull means nothing in the app applies -- no deployments, no CRDs -- so the
          # policies failed `no matches for kind` and the sync retried forever.
          # Same shape as the xpkg.crossplane.io outage the same day; see k3s-on-ec2's
          # docs/REGISTRY_DEPENDENCIES.md.
          #
          # One key covers all seven images: the chart's image helper is
          # `default (default .image.defaultRegistry .globalRegistry) .image.registry`
          # and every per-component `image.registry` is null, so this is what resolves.
          # Verified by rendering the chart: background-controller, cleanup-controller,
          # kyverno-cli, kyverno, kyvernopre, readiness-checker and reports-controller
          # all move to ghcr.io/kyverno/..., and all seven repos answer 200 on ghcr's
          # token endpoint.
          global:
            image:
              registry: ghcr.io
          customLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          crds:
            migration:
              podLabels:
                {{- include "bootstrap.ownerLabels" . | nindent 16 }}
          webhooksCleanup:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          admissionController:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          backgroundController:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          cleanupController:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          reportsController:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
