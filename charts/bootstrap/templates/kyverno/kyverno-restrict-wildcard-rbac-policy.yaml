apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-wildcard-rbac
  annotations:
    policies.kyverno.io/title: Restrict Wildcard RBAC
    policies.kyverno.io/category: Zero Trust, RBAC Security
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Role, ClusterRole
    policies.kyverno.io/description: >-
      A `*` in a Role or ClusterRole's verbs or resources grants far more
      access than almost any workload needs and makes the blast radius of a
      compromised identity unbounded. This policy flags any rule that uses
      a wildcard in place of an explicit verb or resource list.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["roles", "clusterroles"]
  # argocd-server/argocd-application-controller need broad access to manage
  # arbitrary Applications' target resources; Crossplane's own ClusterRoles
  # (crossplane, crossplane-rbac-manager, the aggregate-to-* roles, and the
  # provider-specific aggregate-to-crossplane roles from cnpg/barmancloud/etc.)
  # need wildcard access to manage CRDs it doesn't know about at install time.
  # Both are inherent to how these controllers work, not something to fix.
  #
  # The `kubernetes.io/bootstrapping: rbac-defaults` label marks the
  # kube-apiserver's own built-in ClusterRoles (cluster-admin,
  # system:kube-controller-manager, system:kubelet-api-admin, and the
  # system:controller:* roles) - the API server reconciles these itself on
  # every restart (rbac.authorization.kubernetes.io/autoupdate: true); they
  # live in no chart or repo we control.
  #
  # k3s-cloud-controller-manager is k3s's own embedded Addon manifest,
  # applied by the k3s server process at node startup, not by any Helm
  # chart or ArgoCD Application.
  #
  # NB: object.metadata.labels['key'] errors (not false) when the map exists
  # but lacks that key, so the bootstrapping check must use `in` - `has()`
  # only confirms the labels field itself is present, not a specific key.
  matchConditions:
  - name: exclude-known-legit-wildcard-rbac
    expression: >-
      !(object.metadata.name in ['argocd-server', 'argocd-application-controller', 'k3s-cloud-controller-manager'] ||
        object.metadata.name.contains('crossplane') ||
        (has(object.metadata.labels) &&
         'kubernetes.io/bootstrapping' in object.metadata.labels &&
         object.metadata.labels['kubernetes.io/bootstrapping'] == 'rbac-defaults'))
  validations:
  - expression: >-
      !has(object.rules) || object.rules == null || object.rules.all(r,
        !(has(r.verbs) && r.verbs.exists(v, v == '*')) &&
        !(has(r.resources) && r.resources.exists(res, res == '*'))
      )
    message: "Wildcard '*' is not allowed in verbs or resources for Roles/ClusterRoles."
