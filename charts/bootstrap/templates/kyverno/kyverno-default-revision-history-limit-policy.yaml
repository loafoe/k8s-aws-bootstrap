apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: default-revision-history-limit
  annotations:
    policies.kyverno.io/title: Default Revision History Limit
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/description: >-
      Sets revisionHistoryLimit to 3 on Deployments, StatefulSets, and DaemonSets
      when not explicitly configured. Kubernetes defaults this to 10, which can
      accumulate excessive ReplicaSets over time. A limit of 3 balances
      rollback capability with resource efficiency.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "statefulsets", "daemonsets"]
  matchConditions:
  - name: revision-history-limit-unset
    expression: "!has(object.spec.revisionHistoryLimit)"
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >-
        Object{
          spec: Object.spec{
            revisionHistoryLimit: 3
          }
        }
