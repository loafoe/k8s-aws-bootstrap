apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-external-dns-pod-identity
  annotations:
    policies.kyverno.io/title: Validate External DNS Pod Identity
    policies.kyverno.io/category: Security, AWS
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/description: >-
      This policy ensures that External DNS pods have the AWS_ROLE_ARN
      environment variable injected by the EKS Pod Identity webhook. If the environment
      variable is missing, the pod is rejected, allowing the webhook to retry the mutation.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  # No autogen: this matches the live controller Pod the EKS Pod Identity
  # webhook mutates; an autogenerated controller-level copy would check a
  # template spec that never carries the injected env var. Disabled below,
  # not just asserted here: the autogen default (CHAR-35) silently
  # generates a Deployment/DaemonSet/ReplicaSet/StatefulSet/Job rule from
  # the name-based matchCondition unless explicitly turned off, and that
  # rule errors on every object because spec.template.metadata.name is
  # never set.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  matchConditions:
  - name: is-external-dns-pod
    expression: >-
      object.metadata.namespace == 'external-dns' &&
      object.metadata.name.startsWith('external-dns-')
  validations:
  - expression: >-
      !object.spec.containers.exists(c, c.name == 'external-dns' &&
        (!has(c.env) || !c.env.exists(e, e.name == 'AWS_ROLE_ARN')))
    message: >-
      External DNS pod must have AWS_ROLE_ARN injected into container 'external-dns' by the EKS Pod Identity webhook. Check the webhook status and restart the pod if credentials are missing.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-external-dns-serviceaccount-pod-identity
  annotations:
    policies.kyverno.io/title: Validate External DNS ServiceAccount Pod Identity
    policies.kyverno.io/category: Security, AWS
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/description: >-
      This policy ensures that External DNS pods are using the correct
      service account that has the EKS role annotation for pod identity.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  # No autogen: this matches the live controller Pod; see the sibling
  # validate-external-dns-pod-identity policy above for why the name-based
  # matchCondition makes an autogenerated controller-level copy error out.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  matchConditions:
  - name: is-external-dns-pod
    expression: >-
      object.metadata.namespace == 'external-dns' &&
      object.metadata.name.startsWith('external-dns-')
  validations:
  - expression: >-
      has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'external-dns'
    message: >-
      External DNS pod must run with ServiceAccount 'external-dns' in namespace 'external-dns' so Pod Identity can assume the required AWS IAM role.
