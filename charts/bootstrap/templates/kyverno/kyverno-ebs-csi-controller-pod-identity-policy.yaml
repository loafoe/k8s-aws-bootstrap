apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-ebs-csi-controller-pod-identity
  annotations:
    policies.kyverno.io/title: Validate EBS CSI Controller Pod Identity
    policies.kyverno.io/category: Security, AWS
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/description: >-
      This policy ensures that EBS CSI Controller pods have the AWS_ROLE_ARN
      environment variable injected by the EKS Pod Identity webhook. If the environment
      variable is missing, the pod is rejected, allowing the webhook to retry the mutation.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  # No autogen: this matches the live controller Pod the EKS Pod Identity
  # webhook mutates; an autogenerated controller-level copy would check a
  # template spec that never carries the injected env var. Disabled below,
  # not just asserted here: the autogen default (CHAR-35) silently
  # generates a Deployment/DaemonSet/ReplicaSet/StatefulSet/Job rule from
  # the name-based matchCondition unless explicitly turned off, and that
  # rule errors on every object because spec.template.metadata.name is
  # never set.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  matchConditions:
  - name: is-ebs-csi-controller-pod
    expression: >-
      object.metadata.namespace == 'aws-ebs-csi-driver' &&
      object.metadata.name.startsWith('ebs-csi-controller-')
  validations:
  - expression: >-
      !object.spec.containers.exists(c, c.name == 'ebs-plugin' &&
        (!has(c.env) || !c.env.exists(e, e.name == 'AWS_ROLE_ARN')))
    message: >-
      EBS CSI Controller pod must have AWS_ROLE_ARN injected into container 'ebs-plugin' by the EKS Pod Identity webhook. Verify the webhook deployment and restart the controller pod if credentials are absent.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-ebs-csi-controller-serviceaccount-pod-identity
  annotations:
    policies.kyverno.io/title: Validate EBS CSI Controller ServiceAccount Pod Identity
    policies.kyverno.io/category: Security, AWS
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/description: >-
      This policy ensures that EBS CSI Controller pods are using the correct
      service account that has the EKS role annotation for pod identity.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  # No autogen: this matches the live controller Pod; see the sibling
  # validate-ebs-csi-controller-pod-identity policy above for why the
  # name-based matchCondition makes an autogenerated controller-level copy
  # error out.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  matchConditions:
  - name: is-ebs-csi-controller-pod
    expression: >-
      object.metadata.namespace == 'aws-ebs-csi-driver' &&
      object.metadata.name.startsWith('ebs-csi-controller-')
  validations:
  - expression: >-
      has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'aws-ebs-csi-driver'
    message: >-
      EBS CSI Controller pod must run with ServiceAccount 'aws-ebs-csi-driver' in namespace 'aws-ebs-csi-driver' so Pod Identity can assume the correct AWS IAM role.
