{{- if .Values.features.kyverno.requireImageDigest.enabled }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Require Image Digest
    policies.kyverno.io/category: Zero Trust, Software Supply Chain Security
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      A tag can be moved to point at a different image at any time, so a Pod
      pinned only by tag is not reproducible and can silently start running
      different code. This policy requires every container image to be
      pinned by its immutable `@sha256:` digest.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
      - deployments
      - daemonsets
      - statefulsets
      - jobs
      - cronjobs
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  validations:
  - expression: >-
      object.spec.containers.all(c, c.image.contains('@sha256:')) &&
      (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.contains('@sha256:')))
    message: "Container images must be pinned to an immutable digest (e.g. `image@sha256:...`)."
{{- end }}
