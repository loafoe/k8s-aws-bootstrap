# Grants kyverno's background-controller / reports-controller read access to
# resource kinds that CHAR-18/CHAR-22's CEL ValidatingPolicies match against
# but that Kyverno's own built-in RBAC bundle doesn't cover:
#   - restrict-wildcard-rbac / restrict-escalation-verbs match Role/ClusterRole
#   - restrict-cluster-admin-binding matches ClusterRoleBinding
#   - helmapplication-forbid-argocd-finalizer matches the Crossplane-defined
#     dip.io HelmApplication CRD (same class of gap as centcom-satellite's
#     Crossplane CR RBAC - see innovation-day/AGENTS.md's "RBAC: letting
#     get_resource/list_resources read a custom CR")
#
# Without this, each policy's admission webhook still enforces on new/
# changed resources (status shows WebhookConfigured: true regardless), but
# Kyverno can never background-scan resources that already existed before
# the policy was created: status shows RBACPermissionsGranted: False /
# "Policy is not ready for reporting", and the policy never appears in any
# PolicyReport result. Confirmed live on dip-ce-k3s-eu 2026-10-27 for exactly
# these 4 policies.
#
# Also grants gateway.networking.k8s.io httproutes/grpcroutes/tlsroutes:
# unique-{http,grpc,tls}route-hostnames (CHAR-22) call resource.List() on
# these kinds from within their CEL expression. kyverno-admission-controller
# already has read access to them (so the actual Deny-time enforcement is
# unaffected either way), but reports-controller doesn't, and tries to start
# a watch on all three regardless of each policy's own
# evaluation.background.enabled: false - logging a continuous
# "missing RBAC to list/watch this resource" error every scan cycle
# otherwise.
#
# Also grants postgresql.cnpg.io clusters: the cnpg-force-imagecatalog
# MutatingPolicy (migrated to CEL in the cloudnative-pg-operator chart,
# philips-software/helm-charts, not this repo) matches Cluster resources.
# Same gap, same symptom -- confirmed live on dip-ce-k3s-eu right after the
# kyverno 1.20.0 upgrade this file's RBAC grant unblocked: reports-controller
# logged a continuous "missing RBAC to list/watch this resource" error for
# clusters.postgresql.cnpg.io until this rule was added. Unconditional, not
# gated on a values flag: CNPG is a standing component of every cluster this
# chart bootstraps, same as the two unconditional rules above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-background-scan-rbac
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - clusterroles
  - clusterrolebindings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dip.io
  resources:
  - helmapplications
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
{{- if .Values.features.gatewayApi.enabled }}
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  - grpcroutes
  - tlsroutes
  verbs:
  - get
  - list
  - watch
{{- end }}
