apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-restricted-pod-security
  annotations:
    policies.kyverno.io/title: Require Restricted Pod Security
    policies.kyverno.io/category: Zero Trust, Pod Security Standards (Restricted)
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privileged containers, privilege escalation, and host namespace
      sharing give a container a direct path to the underlying node and
      defeat any other isolation the cluster relies on. This policy flags
      Pods that run privileged containers, allow privilege escalation, or
      share the host network, PID, or IPC namespace.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
      - deployments
      - daemonsets
      - statefulsets
      - jobs
      - cronjobs
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  # CSI node plugins (aws-ebs-csi-driver/ebs-csi-node, spire-system/spire-spiffe-csi-driver)
  # must run privileged to mount volumes/sockets into other pods' namespaces.
  # spire-system/spire-agent needs the host PID namespace to attest workloads
  # by process, and host network to reach the node's SPIRE server endpoint.
  # prometheus/kps-prometheus-node-exporter needs host network/PID to read
  # host-level metrics. All four are inherent to what these DaemonSets do.
  matchConditions:
  - name: exclude-known-legit-pod-security
    expression: >-
      !(
        (object.metadata.namespace == 'aws-ebs-csi-driver' && object.metadata.name.startsWith('ebs-csi-node')) ||
        (object.metadata.namespace == 'spire-system' && object.metadata.name.startsWith('spire-spiffe-csi-driver')) ||
        (object.metadata.namespace == 'spire-system' && object.metadata.name.startsWith('spire-agent')) ||
        (object.metadata.namespace == 'prometheus' && object.metadata.name.startsWith('kps-prometheus-node-exporter'))
      )
  validations:
  - expression: >-
      (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) &&
      (!has(object.spec.hostPID) || !object.spec.hostPID) &&
      (!has(object.spec.hostIPC) || !object.spec.hostIPC)
    message: "Pods must not share the host network, PID, or IPC namespace."
  - expression: >-
      object.spec.containers.all(c,
        (!has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged) &&
        (!has(c.securityContext) || !has(c.securityContext.allowPrivilegeEscalation) || !c.securityContext.allowPrivilegeEscalation)
      )
    message: "Containers must not run as privileged or allow privilege escalation."
