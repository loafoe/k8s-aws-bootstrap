apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-default-serviceaccount
  annotations:
    policies.kyverno.io/title: Disallow Default ServiceAccount
    policies.kyverno.io/category: Zero Trust, RBAC Security
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The `default` ServiceAccount is automounted into every namespace and
      is easy to over-grant by accident, since it is shared by any workload
      that does not request one explicitly. This policy requires Pods to
      specify a dedicated, purpose-built ServiceAccount.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  # No autogen: the namespace/name matchCondition below targets the live Pod.
  # Autogen rewrites it to check the pod-template's metadata.name, which is
  # never set on a PodTemplateSpec, so every autogenerated Deployment/
  # DaemonSet/StatefulSet copy errors instead of evaluating (same CHAR-35
  # issue documented on validate-aws-lbc-pod-identity). Pod-level coverage
  # from matchConstraints below is unaffected - every Pod still gets checked
  # at admission and in the background scan, just not pre-emptively at the
  # controller level.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  # argocd-redis is the bundled Argo CD Helm chart's own Redis instance; it's
  # an in-cluster cache with no API server access, so the upstream chart
  # never gives it a dedicated ServiceAccount. Not worth forking the chart
  # over.
  matchConditions:
  - name: exclude-known-legit-default-serviceaccount
    expression: >-
      !(object.metadata.namespace == 'argocd' && object.metadata.name.startsWith('argocd-redis'))
  validations:
  - expression: >-
      !has(object.spec.serviceAccountName) || object.spec.serviceAccountName != 'default'
    message: "Pods must not use the default ServiceAccount; set `serviceAccountName` to a dedicated service account."
