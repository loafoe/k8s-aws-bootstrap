apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: cnpg-on-demand-nodes
  annotations:
    policies.kyverno.io/title: CNPG On-Demand Nodes
    policies.kyverno.io/category: Best Practices, Database
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/description: >-
      CloudNativePG database pods should run on on-demand nodes for stability.
      Spot instances can be interrupted, causing database failovers and potential
      EBS volume detach/reattach issues. This policy automatically injects the
      nodeSelector to ensure CNPG pods are scheduled on on-demand instances only.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    objectSelector:
      matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  # nodeSelector is an atomic map in the Pod schema, so an ApplyConfiguration
  # patch (structured merge) is rejected outright ("may not mutate atomic
  # ... maps"); a JSONPatch add is used instead, merging in the single key
  # when nodeSelector already exists and creating the map otherwise - the
  # same semantics as the legacy patchStrategicMerge.
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: >-
        has(object.spec.nodeSelector) ?
          [JSONPatch{op: "add", path: "/spec/nodeSelector/" + jsonpatch.escapeKey("karpenter.sh/capacity-type"), value: "on-demand"}] :
          [JSONPatch{op: "add", path: "/spec/nodeSelector", value: {"karpenter.sh/capacity-type": "on-demand"}}]
