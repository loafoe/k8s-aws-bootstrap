apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-karpenter-pod-identity
  annotations:
    policies.kyverno.io/title: Validate Karpenter Pod Identity
    policies.kyverno.io/category: Security, AWS
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/description: >-
      This policy ensures that Karpenter controller pods have the AWS_ROLE_ARN
      environment variable injected by the EKS Pod Identity webhook. If the environment
      variable is missing, the pod is rejected, allowing the webhook to retry the mutation.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  # No autogen: this matches the live controller Pod the EKS Pod Identity
  # webhook mutates; an autogenerated controller-level copy would check a
  # template spec that never carries the injected env var.
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  matchConditions:
  - name: is-karpenter-pod
    expression: >-
      object.metadata.namespace == 'karpenter' &&
      object.metadata.name.startsWith('karpenter-')
  validations:
  - expression: >-
      !object.spec.containers.exists(c, c.name == 'controller' &&
        (!has(c.env) || !c.env.exists(e, e.name == 'AWS_ROLE_ARN')))
    message: >-
      Karpenter controller pod must have AWS_ROLE_ARN injected into container 'controller' by the EKS Pod Identity webhook. Confirm the webhook is healthy and redeploy the controller if needed.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-karpenter-serviceaccount-pod-identity
  annotations:
    policies.kyverno.io/title: Validate Karpenter ServiceAccount Pod Identity
    policies.kyverno.io/category: Security, AWS
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/description: >-
      This policy ensures that Karpenter controller pods are using the correct
      service account that has the EKS role annotation for pod identity.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  matchConditions:
  - name: is-karpenter-pod
    expression: >-
      object.metadata.namespace == 'karpenter' &&
      object.metadata.name.startsWith('karpenter-')
  validations:
  - expression: >-
      has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'karpenter'
    message: >-
      Karpenter controller pod must run with ServiceAccount 'karpenter' in namespace 'karpenter' so Pod Identity can project AWS credentials.
