apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-aws-lbc-pod-identity
  annotations:
    policies.kyverno.io/title: Validate AWS Load Balancer Controller Pod Identity Webhook Mutation
    policies.kyverno.io/category: Security, AWS
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/description: >-
      This policy ensures that AWS Load Balancer Controller pods have the AWS_ROLE_ARN
      environment variable injected by the EKS Pod Identity webhook. If the environment
      variable is missing, the pod is rejected, forcing the webhook to retry the mutation.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  # No autogen: the namespace/name match below targets the live controller
  # Pod that the EKS Pod Identity webhook mutates. A Deployment-level
  # autogenerated copy would check a template spec that never carries the
  # injected env var, so it would be a permanently-failing false positive.
  # Disabled below, not just asserted here: the autogen default (CHAR-35)
  # silently generates that controller-level rule from the name-based
  # matchCondition unless explicitly turned off, and it errors on every
  # object because spec.template.metadata.name is never set.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  matchConditions:
  - name: is-aws-lbc-pod
    expression: >-
      object.metadata.namespace == 'aws-load-balancer-controller' &&
      object.metadata.name.startsWith('aws-load-balancer-controller-')
  validations:
  - expression: >-
      !object.spec.containers.exists(c, c.name == 'aws-load-balancer-controller' &&
        (!has(c.env) || !c.env.exists(e, e.name == 'AWS_ROLE_ARN')))
    message: >-
      AWS Load Balancer Controller pod must have AWS_ROLE_ARN environment variable injected by the EKS Pod Identity webhook.
      The webhook should read the 'eks.amazonaws.com/role-arn' annotation from the service account and inject it as AWS_ROLE_ARN env var.
