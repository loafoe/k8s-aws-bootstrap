apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-escalation-verbs
  annotations:
    policies.kyverno.io/title: Restrict Escalation Verbs
    policies.kyverno.io/category: Zero Trust, RBAC Security
    policies.kyverno.io/minversion: 1.14.0
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Role, ClusterRole
    policies.kyverno.io/description: >-
      The `bind`, `escalate`, and `impersonate` verbs let a principal grant
      itself permissions it does not already hold, which defeats RBAC's
      least-privilege model. This policy flags any Role or ClusterRole rule
      that grants one of these verbs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["roles", "clusterroles"]
  # A wildcard verb necessarily includes bind/escalate/impersonate, so the
  # validation below treats '*' as escalation too. The same known-legit
  # wildcard grants excluded by restrict-wildcard-rbac therefore have to be
  # excluded here as well:
  #
  # - Crossplane's own ClusterRoles (crossplane-rbac-manager and the
  #   aggregate-to-* roles) grant wildcard verbs to manage arbitrary CRDs
  #   and provider-declared RBAC.
  # - argocd-server/argocd-application-controller need broad access to
  #   manage arbitrary Applications' target resources.
  # - k3s-cloud-controller-manager is k3s's own embedded Addon, using
  #   wildcard verbs on nodes/daemonsets.
  # - k8s-monitoring-alloy-operator (upstream grafana/k8s-monitoring chart,
  #   via our k8s-observability-monitoring chart) needs bind/escalate on
  #   clusterroles/clusterrolebindings/roles/rolebindings to provision RBAC
  #   for the Alloy CRs it manages - same pattern as
  #   crossplane-rbac-manager, just not something we author.
  #
  # The `kubernetes.io/bootstrapping: rbac-defaults` label marks the
  # kube-apiserver's own built-in ClusterRoles (admin, edit,
  # system:aggregate-to-edit, system:controller:clusterrole-aggregation-controller)
  # - reconciled by the API server itself, not by any chart or repo we
  # control.
  #
  # NB: object.metadata.labels['key'] errors (not false) when the map exists
  # but lacks that key, so the bootstrapping check must use `in` - `has()`
  # only confirms the labels field itself is present, not a specific key.
  matchConditions:
  - name: exclude-known-legit-escalation-verbs
    expression: >-
      !(object.metadata.name.contains('crossplane') ||
        object.metadata.name in ['argocd-server', 'argocd-application-controller', 'k8s-monitoring-alloy-operator', 'k3s-cloud-controller-manager'] ||
        (has(object.metadata.labels) &&
         'kubernetes.io/bootstrapping' in object.metadata.labels &&
         object.metadata.labels['kubernetes.io/bootstrapping'] == 'rbac-defaults'))
  validations:
  - expression: >-
      !has(object.rules) || object.rules == null || object.rules.all(r,
        !(has(r.verbs) && r.verbs.exists(v, v in ['bind', 'escalate', 'impersonate', '*']))
      )
    message: >-
      RBAC rules must not grant the 'bind', 'escalate', or 'impersonate'
      verbs. A wildcard '*' verb is treated as granting escalation too,
      since it necessarily includes all three.
