apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: validate-cert-manager-serviceaccount-pod-identity
  annotations:
    policies.kyverno.io/title: Validate Cert-Manager ServiceAccount Pod Identity
    policies.kyverno.io/category: Security, AWS
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      This policy audits that the cert-manager controller pod (the only
      cert-manager component that talks to AWS) uses the 'cert-manager'
      service account that carries the EKS Pod Identity role annotation.
      Scoped to app.kubernetes.io/component=controller only: cainjector,
      webhook and startupapicheck are separate components with their own
      dedicated service accounts by chart design and never need AWS
      credentials, so they are intentionally excluded from this check.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "5"
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: validate-cert-manager-serviceaccount-name
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - cert-manager
          selector:
            matchLabels:
              app.kubernetes.io/component: controller
          operations:
          - CREATE
          - UPDATE
    validate:
      message: >-
        [AUDIT] Cert-manager controller pod should use ServiceAccount 'cert-manager' in namespace 'cert-manager' so Pod Identity can supply AWS credentials.
      deny:
        conditions:
          all:
          - key: "{{ `{{ request.object.spec.serviceAccountName }}` }}"
            operator: NotEquals
            value: "cert-manager"
