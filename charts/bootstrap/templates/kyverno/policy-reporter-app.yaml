apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-reporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/manifest-generate-paths: /charts/policy-reporter
spec:
  destination:
    namespace: kyverno
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/policy-reporter
    targetRevision: policy-reporter-3.11.2-0.1.1
    helm:
      valuesObject:
        policy-reporter:
          podLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
      # Its ServiceMonitor needs the monitoring.coreos.com CRD, which only exists once
      # kube-prometheus-stack (sync-wave 16) has synced; this is wave 3, and prune=true
      # here makes a missing CRD fail the whole sync, not just this one resource.
      - SkipDryRunOnMissingResource=true
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
