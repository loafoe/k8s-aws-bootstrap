apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-reporter
  namespace: argocd
  annotations:
    # Wave 17, after kube-prometheus-stack (16): its ServiceMonitor needs
    # monitoring.coreos.com. At wave 3 the Application-level
    # SkipDryRunOnMissingResource only defers validation -- the *apply* still fails every
    # attempt until the CRD exists, so the app sat in a retry storm and the parent's wave 3
    # waited on it (fleet00, 2026-11-25). Nothing needs policy-reporter before the stack
    # that scrapes it.
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/manifest-generate-paths: /charts/policy-reporter
spec:
  destination:
    namespace: kyverno
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/policy-reporter
    targetRevision: policy-reporter-3.11.2-0.1.1
    helm:
      valuesObject:
        policy-reporter:
          podLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
      # Belt: the wave move above is what keeps this app from running before
      # kube-prometheus-stack (16) has installed monitoring.coreos.com; the option keeps a
      # stray ServiceMonitor from failing the whole sync, since prune=true here.
      - SkipDryRunOnMissingResource=true
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
