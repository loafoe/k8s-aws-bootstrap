{{- if and .Values.features.hspAwsPlatform.enabled .Values.features.hspAwsPlatform.hspAddons }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: hsp-addons
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hsp-addons
  namespace: hsp-addons
  labels:
    cache.kyverno.io/enabled: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  accountId: |
    {{ .Values.environmentConfig.bootstrap.awsAccountId }}
  sharedServicesAccountId: |
    {{ .Values.environmentConfig.sharedServicesAccountId }}
  region: {{ .Values.environmentConfig.bootstrap.awsRegion }}
  partition: {{ .Values.environmentConfig.bootstrap.awsPartition }}
  oidcProvider: {{ .Values.environmentConfig.bootstrap.oidcProvider }}
  oidcProviderArn: {{ .Values.environmentConfig.bootstrap.oidcProviderArn }}
  enabledPullThroughRegistries: |
    {{- include "hspAddons.pullThroughRegistries" . | nindent 4 }}
  eks: |
    {{- include "hspAddons.eks" . | nindent 4 }}
  servicesVpc: |
    {{- include "hspAddons.servicesVpc" . | nindent 4 }}
  tags: |
    {{- include "hspAddons.tags" . | nindent 4 }}
---
# What Crossplane compositions read: the same data as the ConfigMap, the JSON values as
# structures. Rendered here rather than converted from the ConfigMap by a Job, which had to
# download kubectl, jq and yq at runtime (GitHub releases) and blocked the sync when it couldn't
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: hsp-addons
data:
  accountId: {{ .Values.environmentConfig.bootstrap.awsAccountId | toString | trim | quote }}
  sharedServicesAccountId: {{ .Values.environmentConfig.sharedServicesAccountId | toString | trim | quote }}
  region: {{ .Values.environmentConfig.bootstrap.awsRegion | toString | trim | quote }}
  partition: {{ .Values.environmentConfig.bootstrap.awsPartition | toString | trim | quote }}
  oidcProvider: {{ .Values.environmentConfig.bootstrap.oidcProvider | toString | trim | quote }}
  oidcProviderArn: {{ .Values.environmentConfig.bootstrap.oidcProviderArn | toString | trim | quote }}
  enabledPullThroughRegistries:
    {{- include "hspAddons.pullThroughRegistries" . | fromJsonArray | toYaml | nindent 4 }}
  eks:
    {{- include "hspAddons.objectYaml" (dict "name" "eks" "json" (include "hspAddons.eks" .)) | nindent 4 }}
  servicesVpc:
    {{- include "hspAddons.objectYaml" (dict "name" "servicesVpc" "json" (include "hspAddons.servicesVpc" .)) | nindent 4 }}
  tags:
    {{- include "hspAddons.objectYaml" (dict "name" "tags" "json" (include "hspAddons.tags" .)) | nindent 4 }}
{{- end }}
