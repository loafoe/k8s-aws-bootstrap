{{- if and .Values.features.hspAwsPlatform.enabled .Values.features.hspAwsPlatform.vpa }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vertical-pod-autoscaler
  namespace: argocd
  annotations:
    # Must run before anything that renders a VerticalPodAutoscaler: kube-prometheus-stack
    # (16), crossplane-providers-aws (18) and cloudnative-pg-operator (21) all do, and a
    # 6, not 15: consumers of the VPA CRD are kube-prometheus-stack (16),
    # crossplane-providers-aws (18) and cloudnative-pg-operator (21), which render
    # VerticalPodAutoscalers, and at 15 the parent still reached wave 18 before this app's CRDs
    # were established -- fleet00, 2026-11-26: `no matches for kind "VerticalPodAutoscaler"`
    # from provider-aws-iam-vpa, three sync retries. Ten waves of margin is the guarantee
    # available: the parent gates a wave on a child Application's health, and a child that has
    # not synced yet does not look unhealthy.
    #
    # Not wave -5 or 1 (the first attempt, 2026-11-26): there is no upstream CRD-only chart for
    # the VPA, so this Application has to own both the CRDs and the controllers -- and its
    # controllers have neither a CriticalAddonsOnly toleration nor a node-type selector. Before
    # the NodePools at wave 4 there is no schedulable node at all (the master and the system
    # pool are both tainted), so at 1 the app would sit with three Pending pods and hold the
    # parent's gate for minutes on every attempt. kyverno sits at 5 for exactly this reason;
    # 6 puts these CRDs ten waves ahead of their first consumer and their pods on the first
    # Karpenter node.
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/manifest-generate-paths: /charts/vertical-pod-autoscaler
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/vertical-pod-autoscaler
    targetRevision: vertical-pod-autoscaler-0.17.0-0.1.6
    helm:
      valuesObject:
        vertical-pod-autoscaler:
          # The `InPlace` feature gate, so the crossplane providers' VPAs can ask for
          # updateMode: InPlace. Without the gate the admission controller rejects the
          # object outright -- fleet00 (2026-11-24) failed crossplane-providers-aws for
          # 9 retries and counting with
          #   spec.updatePolicy.updateMode: Forbidden: in order to use UpdateMode InPlace,
          #   you must enable feature gate InPlace in the admission-controller args
          # so all five VPAs were never created at all (and the app could never reach
          # Synced). InPlace is what stops a VPA whose target has outgrown its requests
          # from being converted into an eviction when the resize cannot fit on the node
          # -- see crossplane/crossplane-providers-aws-app.yaml. Non-GA upstream, hence
          # spelled out here rather than assumed: it is a deliberate opt-in.
          featureGates:
            InPlace: true
          commonLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          admissionController:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          recommender:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          updater:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: vpa-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
{{- end }}
