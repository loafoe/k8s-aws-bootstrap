{{- if and .Values.features.hspAwsPlatform.enabled .Values.features.hspAwsPlatform.vpa }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vertical-pod-autoscaler
  namespace: argocd
  annotations:
    # Must run before anything that renders a VerticalPodAutoscaler: kube-prometheus-stack
    # (16), crossplane-providers-aws (18) and cloudnative-pg-operator (21) all do, and a
    # VPA cannot be applied before its CRD exists -- those apps fail every sync attempt
    # until this one lands. SkipDryRunOnMissingResource does not help across Applications
    # (it only defers validate-time to apply-time), and the parent app gates on child
    # health, not sync success, so nothing else catches it. See
    # skills/maintaining-sync-wave-crds/SKILL.md.
    argocd.argoproj.io/sync-wave: "15"
    argocd.argoproj.io/manifest-generate-paths: /charts/vertical-pod-autoscaler
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/vertical-pod-autoscaler
    targetRevision: vertical-pod-autoscaler-0.17.0-0.1.6
    helm:
      valuesObject:
        vertical-pod-autoscaler:
          # The `InPlace` feature gate, so the crossplane providers' VPAs can ask for
          # updateMode: InPlace. Without the gate the admission controller rejects the
          # object outright -- fleet00 (2026-11-24) failed crossplane-providers-aws for
          # 9 retries and counting with
          #   spec.updatePolicy.updateMode: Forbidden: in order to use UpdateMode InPlace,
          #   you must enable feature gate InPlace in the admission-controller args
          # so all five VPAs were never created at all (and the app could never reach
          # Synced). InPlace is what stops a VPA whose target has outgrown its requests
          # from being converted into an eviction when the resize cannot fit on the node
          # -- see crossplane/crossplane-providers-aws-app.yaml. Non-GA upstream, hence
          # spelled out here rather than assumed: it is a deliberate opt-in.
          featureGates:
            InPlace: true
          commonLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          admissionController:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          recommender:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          updater:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: vpa-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
{{- end }}
