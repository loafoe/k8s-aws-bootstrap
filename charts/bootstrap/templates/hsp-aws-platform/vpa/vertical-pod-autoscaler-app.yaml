{{- if and .Values.features.hspAwsPlatform.enabled .Values.features.hspAwsPlatform.vpa }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vertical-pod-autoscaler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "21"
    argocd.argoproj.io/manifest-generate-paths: /charts/vertical-pod-autoscaler
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/vertical-pod-autoscaler
    targetRevision: HEAD
    helm:
      valuesObject:
        vertical-pod-autoscaler:
          commonLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
          admissionController:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          recommender:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
          updater:
            podLabels:
              {{- include "bootstrap.ownerLabels" . | nindent 14 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: vpa-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
{{- end }}
