{{- if and .Values.features.hspAwsPlatform.enabled .Values.features.hspAwsPlatform.cloudnativePg.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "21"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/manifest-generate-paths: /charts/cloudnative-pg
spec:
  project: default
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/cloudnative-pg
    targetRevision: HEAD
    helm:
      valuesObject:
        cloudnative-pg:
          podLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
        plugin-barman-cloud:
          podLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
{{- end }}
