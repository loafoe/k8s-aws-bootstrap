apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: common-bootstrap
  namespace: argocd
  annotations:
    # Wave 4, not 1: these Compositions are apiextensions.crossplane.io objects whose
    # pipeline references Functions, and both come from Applications that are now part of
    # the wave map -- `crossplane` (wave 2) installs the CRDs, `crossplane-functions`
    # (wave 3) the functions. Until 2026-11-24 the master applied this out of band during
    # boot, which is also why a CompositionRevision flip could hit a running bootstrap: the
    # revision hash includes the resolved functions, so applying the Composition before the
    # functions were active minted a second revision mid-sync. After the functions, one.
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/manifest-generate-paths: kustomize
spec:
  destination:
    name: in-cluster
    namespace: common-bootstrap
  project: {{ .Values.project }}
  source:
    repoURL: oci://ghcr.io/philips-software/helm-charts/common-bootstrap
    # renovate: datasource=docker depName=ghcr.io/philips-software/helm-charts/common-bootstrap
    targetRevision: 2.3.1
    path: .
    helm:
      valuesObject:
        crossplaneCompositions:
          repoURL: https://github.com/loafoe/crossplane-compositions
          # renovate: datasource=github-tags depName=loafoe/crossplane-compositions
          targetRevision: v0.0.59
          path: kustomize
        # argocd.project.sourceRepos removed 2026-10-25: chart >=2.0.0 split
        # the single common-bootstrap AppProject into argocd.projects.infra /
        # argocd.projects.apps (see philips-software/helm-charts), and the
        # chart's own defaults for both already cover everything this
        # override listed.
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
