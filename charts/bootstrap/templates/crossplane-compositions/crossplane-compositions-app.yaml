apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: common-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/manifest-generate-paths: kustomize
spec:
  destination:
    name: in-cluster
    namespace: common-bootstrap
  project: default
  source:
    repoURL: oci://ghcr.io/philips-software/helm-charts/common-bootstrap
    # renovate: datasource=docker depName=ghcr.io/philips-software/helm-charts/common-bootstrap
    targetRevision: 2.2.0
    path: .
    helm:
      valuesObject:
        crossplaneCompositions:
          repoURL: https://github.com/loafoe/crossplane-compositions
          # renovate: datasource=github-tags depName=loafoe/crossplane-compositions
          targetRevision: v0.0.52
          path: kustomize
        # argocd.project.sourceRepos removed 2026-10-25: chart >=2.0.0 split
        # the single common-bootstrap AppProject into argocd.projects.infra /
        # argocd.projects.apps (see philips-software/helm-charts), and the
        # chart's own defaults for both already cover everything this
        # override listed.
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
