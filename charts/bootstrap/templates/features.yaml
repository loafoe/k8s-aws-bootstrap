apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: k8s-aws-bootstrap-base-features
  labels:
    config: dip-software
  annotations:
    # Wave 4, after the `crossplane` Application (wave 2) installs
    # apiextensions.crossplane.io. These sat at the default wave 0 until the master stopped
    # installing Crossplane during boot.
    argocd.argoproj.io/sync-wave: "4"
    # No CRD exists when Argo CD validates the whole app (the crossplane Application installs
    # apiextensions.crossplane.io at wave 2, after this validation but before this wave), so
    # skip the dry run and let the apply happen where the wave map puts it.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
data:
  features:
    argoCd: true
    certManager: true
    cilium: true
    crossplane: true
    dipCompositions: true
    externalDns: true
    helmApplication: true
    irsa: true
    karpenter: true
    kubePrometheusStack: true
    kyverno: true
