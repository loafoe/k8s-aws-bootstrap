{{- if and .Values.features.gatewayApi.enabled .Values.features.gatewayApi.sharedGateway.enabled (not .Values.features.shutdown.enabled) }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      service.beta.kubernetes.io/aws-load-balancer-alpn-policy: HTTP2Preferred
      service.beta.kubernetes.io/aws-load-balancer-name: {{ printf "%s-gateway" .Values.environmentConfig.bootstrap.resourcePrefix }}
      {{- if .Values.environmentConfig.bootstrap.enableDualStack }}
      # IPv6 instance targets need a node IPv6 that Cilium serves NodePorts on: the
      # EC2NodeClass registers workers with --node-ip=<IPv4>,<IPv6> on dual-stack clusters.
      # Every node also needs a primary IPv6, or RegisterTargets fails for all of them:
      # workers set it in their user data, k3s-on-ec2 sets it on the master (5f95dc6).
      # Verified on a live dual-stack cluster 2026-11-05.
      service.beta.kubernetes.io/aws-load-balancer-ip-address-type: dualstack
      {{- end }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.{{ .Values.environmentConfig.bootstrap.clusterFqdn }}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.environmentConfig.bootstrap.resourcePrefix }}-wildcard-tls
            namespace: kube-system
    {{- range $i, $fqdn := .Values.environmentConfig.bootstrap.additionalClusterFqdns }}
    - name: https-{{ $i }}
      protocol: HTTPS
      port: 443
      hostname: "*.{{ $fqdn }}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $.Values.environmentConfig.bootstrap.resourcePrefix }}-wildcard-{{ $i }}-tls
            namespace: kube-system
    {{- end }}
    - name: tls-passthrough
      protocol: TLS
      port: 8443
      hostname: "*.{{ .Values.environmentConfig.bootstrap.clusterFqdn }}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Passthrough
    {{- range $i, $fqdn := .Values.environmentConfig.bootstrap.additionalClusterFqdns }}
    - name: tls-passthrough-{{ $i }}
      protocol: TLS
      port: 8443
      hostname: "*.{{ $fqdn }}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Passthrough
    {{- end }}
{{- end }}
