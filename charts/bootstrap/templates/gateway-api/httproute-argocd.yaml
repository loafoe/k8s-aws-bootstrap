{{- if and .Values.features.gatewayApi.enabled .Values.features.gatewayApi.httproutes.argocd (not .Values.features.shutdown.enabled) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-route
  namespace: argocd
  annotations:
    # Wave 14: needs the Gateway (13) and the argocd-server Service (argocd app, 10).
    # Not earlier -- with no parent Gateway, or a backendRef that doesn't resolve,
    # HTTPRoute/health.lua reports Progressing / Degraded respectively and the wave
    # either stalls or fails. Shares the spire-federation-tls Certificate's wave, so
    # the route is programmed while that cert's DNS-01 runs.
    argocd.argoproj.io/sync-wave: "14"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Replace=true
    link.argocd.argoproj.io/external-link: https://argocd.{{ .Values.environmentConfig.bootstrap.clusterFqdn }}
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - argocd.{{ .Values.environmentConfig.bootstrap.clusterFqdn }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
{{- end }}
