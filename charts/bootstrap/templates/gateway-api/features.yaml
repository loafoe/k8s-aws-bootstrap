{{- if .Values.features.gatewayApi.enabled }}
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: k8s-aws-bootstrap-overlay-gateway-api-features
  labels:
    config: dip-software
  annotations:
    # Wave 4, after the `crossplane` Application (wave 2) installs
    # apiextensions.crossplane.io. These sat at the default wave 0 until the master stopped
    # installing Crossplane during boot.
    argocd.argoproj.io/sync-wave: "4"
data:
  features:
    gatewayApi: true
{{- end }}
