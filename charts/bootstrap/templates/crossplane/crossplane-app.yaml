apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  annotations:
    # Wave 2: the earliest point after the namespaces (wave 0) at which anything else in
    # this chart needs Crossplane's CRDs (the functions at 3, the compositions and every
    # EnvironmentConfig at 4).
    #
    # Crossplane owns its own PKI. It used to take its CA from a cert-manager Certificate
    # instead, for a "stable, git-tracked CA" that removed a class of
    # "certificate signed by unknown authority" handshakes -- but that Certificate and the
    # chart's own empty Opaque `crossplane-root-ca` could never coexist: a Secret's type is
    # immutable, so whichever was created first won and the other side could never apply
    # (fleet11, 2026-11-25). Crossplane's `core init` generates and signs its own CA just
    # fine, and signs every function/provider cert from it, so the Certificate, its
    # ClusterIssuer and the crossplane-ca-converger Job are all gone.
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/manifest-generate-paths: /charts/crossplane
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/crossplane
    targetRevision: crossplane-v2.5.0-0.1.3
    helm:
      valuesObject:
        crossplane:
          customLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
