apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  annotations:
    # Wave 2 (after crossplane-pki at wave 1; cert-manager itself is wave 0) so the
    # cert-manager managed CA is present in the crossplane-root-ca-cert-manager secret before
    # `core init` runs. core reuses that CA to sign all server/client/package certs,
    # keeping crossplane core and the composition functions on a single, stable CA.
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/manifest-generate-paths: /charts/crossplane
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://github.com/loafoe/k8s-aws-bootstrap
    path: charts/crossplane
    targetRevision: crossplane-v2.5.0-0.1.3
    helm:
      valuesObject:
        crossplane:
          # The CA comes from cert-manager's Certificate (crossplane-pki.yaml) under its
          # own secret name, not from the chart's `crossplane-root-ca`: that Secret is
          # Opaque and immutable, and cert-manager would create it as kubernetes.io/tls.
          # Only the init container reads this (TLS_CA_SECRET_NAME); `core init` reuses an
          # existing CA, so what it finds here is what signs every leaf and package cert.
          extraEnvVarsCrossplaneInit:
            TLS_CA_SECRET_NAME: crossplane-root-ca-cert-manager
          customLabels:
            {{- include "bootstrap.ownerLabels" . | nindent 12 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
