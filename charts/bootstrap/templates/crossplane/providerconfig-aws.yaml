apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    # Wave 22, four past crossplane-providers-aws (18): these are aws.upbound.io CRs, and
    # SkipDryRunOnMissingResource only defers validation -- the apply still fails until the
    # provider's CRDs are installed, which on a cold cluster is well past wave 18 (fleet01,
    # 2026-11-25).
    argocd.argoproj.io/sync-wave: "22"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: IRSA
---
apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "22"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: IRSA
