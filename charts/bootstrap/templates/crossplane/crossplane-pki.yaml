# Crossplane internal PKI, externally managed by cert-manager.
#
# Why this exists:
# Crossplane core (`core init`) bootstraps its own internal CA into the
# `crossplane-root-ca` secret and signs the server/client certs AND every
# per-package (function/provider) TLS server cert from it. `core init` REUSES
# an existing CA secret if `tls.crt`+`tls.key` are already present (verified in
# crossplane v2.3.1 internal/initializer/tls.go `loadOrGenerateCA`).
#
# By having cert-manager populate `crossplane-root-ca` with a STABLE, git-tracked
# CA BEFORE crossplane init runs, every cert crossplane subsequently generates
# chains to one CA that never silently diverges. This removes the recurring
# "certificate signed by unknown authority" handshake failures between crossplane
# core and the composition functions.
#
# The empty Secret below is what makes that work, and it is load-bearing. A Secret's type
# is IMMUTABLE, so whoever creates `crossplane-root-ca` first decides it forever: the
# crossplane chart renders it `type: Opaque`, cert-manager creates a Certificate's secret
# as `kubernetes.io/tls`, and once cert-manager got there first the chart could never apply
# its own version again (fleet11, 2026-11-25: the crossplane Application failed every
# comparison with `field is immutable`, so Crossplane never installed and nothing below it
# in the wave map could apply). Pre-creating it here, empty and Opaque, means cert-manager
# *adopts* the existing secret and preserves the type -- exactly what happened on every
# cluster the master installed Crossplane on, now made deterministic instead of a race.
#
# crossplane-app-plain's Application ignores /data and /type on this Secret
# (resources/bootstrap-app-plain.yaml, ignoreDifferences + RespectIgnoreDifferences), so a
# re-sync of the root app never blanks the CA cert-manager wrote.
#
# Ordering: cert-manager itself is wave 0, so its CRDs and webhook are established
# before anything here is applied; these resources and the ClusterIssuers sit at wave
# 1. The `crossplane` Application is moved to wave 2 so the CA exists in
# `crossplane-root-ca` before `core init` executes.
---
# Pre-created empty so cert-manager preserves the type (see the header). The crossplane
# chart renders the same object; the two definitions are identical apart from this one
# existing before `core init` and before the chart's Application is ever compared.
apiVersion: v1
kind: Secret
metadata:
  name: crossplane-root-ca
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec: {}
type: Opaque
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: crossplane-selfsigned-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crossplane-root-ca
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # This is the secret crossplane `core init` reads as TLS_CA_SECRET_NAME and
  # uses to sign all server/client/package certificates.
  secretName: crossplane-root-ca
  isCA: true
  commonName: crossplane-ca
  duration: 87600h    # 10y, matches crossplane's own internal CA lifetime
  renewBefore: 8760h  # 1y
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: crossplane-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
