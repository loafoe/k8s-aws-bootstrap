apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-functions
  namespace: argocd
  annotations:
    # Wave 6, not 3: this app's own sync applies `Function` objects, and it fails outright
    # when pkg.crossplane.io is not installed yet --
    #   The Kubernetes API could not find pkg.crossplane.io/Function for requested resource
    #   crossplane-system/function-go-templating
    # (fleet00, 2026-11-25). The parent app gates a wave on a child Application's *health*,
    # and a freshly created child with no status reports Healthy, so wave 3 started before
    # the crossplane Application (wave 2) had applied its CRDs. Wave 6 is four waves of
    # slack, and the compositions that reference these functions follow at wave 8.
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: oci://ghcr.io/philips-software/helm-charts/crossplane-functions
    # renovate: datasource=docker depName=ghcr.io/philips-software/helm-charts/crossplane-functions
    targetRevision: 0.0.19
    path: .
    helm:
      valuesObject:
        environmentConfig:
          owner: {{ (.Values.environmentConfig.owner | default .Values.environmentConfig.bootstrap.owner) | quote }}
          managedBy: {{ (.Values.environmentConfig.managedBy | default .Values.environmentConfig.bootstrap.managedBy) | quote }}
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 24Mi
        extraFunctions: []
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
