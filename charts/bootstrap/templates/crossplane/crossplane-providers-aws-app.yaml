apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-providers-aws
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "18"
spec:
  project: {{ .Values.project }}
  source:
    repoURL: oci://ghcr.io/philips-software/helm-charts/crossplane-providers
    # renovate: datasource=docker depName=ghcr.io/philips-software/helm-charts/crossplane-providers
    targetRevision: 0.0.48
    path: .
    helm:
      valuesObject:
        package:
          registry: ghcr.io/crossplane-contrib
        # TODO(remove once crossplane-providers >=0.0.48 is targetRevision here): the chart's
        # VPA resources lack SkipDryRunOnMissingResource, so on a fresh cluster this app's sync
        # fails validation outright before the VPA CRDs exist (wave 21), which blocks the AWS
        # provider packages and everything after them, including the ArgoCD HTTPRoute (wave 22).
        # Fixed upstream in philips-software/helm-charts@d159fcd / bc0427a.
        vpa:
          enabled: false
        environmentConfig:
          accountId: {{ .Values.environmentConfig.bootstrap.awsAccountId | quote }}
          resourcePrefix: {{ .Values.environmentConfig.bootstrap.resourcePrefix | quote }}
          oidcProviderArn: {{ .Values.environmentConfig.bootstrap.oidcProviderArn | quote }}
          oidcProvider: {{ .Values.environmentConfig.bootstrap.oidcProvider | quote }}
          owner: {{ (.Values.environmentConfig.owner | default .Values.environmentConfig.bootstrap.owner) | quote }}
          managedBy: {{ (.Values.environmentConfig.managedBy | default .Values.environmentConfig.bootstrap.managedBy) | quote }}
        providers:
          - name: provider-family-aws
            enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 284Mi
              limits:
                memory: 768Mi
          - name: provider-aws-s3
            enabled: true
            managedPolicyArns:
              - "arn:aws:iam::aws:policy/AmazonS3FullAccess"
            resources:
              requests:
                cpu: 100m
                memory: 284Mi
              limits:
                memory: 768Mi
          - name: provider-aws-rds
            enabled: true
            managedPolicyArns:
              - "arn:aws:iam::aws:policy/AmazonRDSFullAccess"
            resources:
              requests:
                cpu: 100m
                memory: 284Mi
              limits:
                memory: 768Mi
          - name: provider-aws-kms
            enabled: true
            policy: |
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": [
                      "kms:UntagResource",
                      "kms:TagResource",
                      "kms:ScheduleKeyDeletion",
                      "kms:ListRetirableGrants",
                      "kms:ListKeys",
                      "kms:ListAliases",
                      "kms:List*",
                      "kms:Get*",
                      "kms:GenerateRandom",
                      "kms:DescribeCustomKeyStores",
                      "kms:Describe*",
                      "kms:DeleteAlias",
                      "kms:CreateKey",
                      "kms:CreateAlias"
                    ],
                    "Resource": "*"
                  }
                ]
              }
            resources:
              requests:
                cpu: 100m
                memory: 284Mi
              limits:
                memory: 768Mi
        extraProviders:
          - name: provider-aws-iam
            enabled: true
            roleArn: {{ .Values.environmentConfig.bootstrap.crossplaneProviderAwsIamRoleArn }}
            resources:
              requests:
                cpu: 100m
                memory: 284Mi
              limits:
                memory: 768Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - HealthCheckTimeout=10m
    retry:
      # Unlimited; backoff caps at maxDuration. Transient bootstrap failures (e.g. a webhook
      # that isn't serving yet) must heal by themselves instead of exhausting retries
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
