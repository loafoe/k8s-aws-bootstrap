{{- /* Gate the waves that need Crossplane's CRDs, because no wave offset can be right.

       The crossplane chart ships NO CRDs -- not `crds/`, not `templates/`, nothing (v2.5.0:
       `helm template` emits 23 RBAC/Deployment resources and no CRD at all). Crossplane
       core *installs its own CRDs at runtime*, so they only exist once its pod is running,
       and its pod is pinned to node-type=system, i.e. it waits for the first Karpenter
       system node from the NodePools at wave 4. That is why the CRDs turned up 4m20s after
       the Application's first sync on fleet10 (14:45:15 -> 14:49:35): node launch time, not
       a slow apply.

       So a Sync hook is the only reliable gate: it blocks its own wave until the Job
       completes (900s bounded), is a no-op in seconds on later syncs, and turns a broken
       Crossplane into one clear failure instead of a scatter of `no matches for kind`
       retries. It must sit after the NodePools (4) and before the first consumer (6). */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: crossplane-crd-wait
  namespace: crossplane-system
  labels:
    {{- include "bootstrap.ownerLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      name: crossplane-crd-wait
      labels:
        {{- include "bootstrap.ownerLabels" . | nindent 8 }}
    spec:
      serviceAccountName: crossplane-crd-wait
      restartPolicy: Never
      # crossplane-system enforces PodSecurity "restricted".
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - system
                - control-plane
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      containers:
      - name: wait
        # renovate: datasource=docker depName=alpine/k8s
        image: alpine/k8s:1.37.2
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
              - ALL
        env:
        - name: HOME
          value: /tmp
        - name: KUBECACHEDIR
          value: /tmp/.kube/cache
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        command:
        - sh
        - -c
        - |
          set -eu
          for crd in \
            environmentconfigs.apiextensions.crossplane.io \
            compositions.apiextensions.crossplane.io \
            compositeresourcedefinitions.apiextensions.crossplane.io \
            providerrevisions.pkg.crossplane.io \
            functions.pkg.crossplane.io; do
            echo "waiting for $crd to be established..."
            kubectl wait --for=condition=established --timeout=900s "crd/$crd"
          done
          echo "Crossplane's CRDs are established."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane-crd-wait
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-crd-wait
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-crd-wait
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-crd-wait
subjects:
- kind: ServiceAccount
  name: crossplane-crd-wait
  namespace: crossplane-system
