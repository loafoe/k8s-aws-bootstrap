{{- /* Wave-independent gate: block until Crossplane's CRDs actually exist.
       Everything downstream (the EnvironmentConfigs, the compositions, the functions,
       crossplane-providers-aws and the provider configs) needs these, and "three waves
       after the crossplane Application" is not a reliable proxy for them existing: the
       chart's 21 CRDs are applied in a *later* sync pass than its RBAC and Deployments, so
       they landed 4m20s after the Application's first sync on fleet10 (2026-11-25), past
       every wave offset that was still useful for kyverno and the karpenter pools.

       A Sync hook blocks its own wave until the Job completes, which is exactly the
       semantics needed: it waits (up to 15 minutes) and is a no-op in a few seconds on every
       later sync, because the CRDs are already established. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: crossplane-crd-wait
  namespace: crossplane-system
  labels:
    {{- include "bootstrap.ownerLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      name: crossplane-crd-wait
      labels:
        {{- include "bootstrap.ownerLabels" . | nindent 8 }}
    spec:
      serviceAccountName: crossplane-crd-wait
      restartPolicy: Never
      # crossplane-system enforces PodSecurity "restricted".
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - system
                - control-plane
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      containers:
      - name: wait
        # renovate: datasource=docker depName=alpine/k8s
        image: alpine/k8s:1.37.2
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
              - ALL
        env:
        - name: HOME
          value: /tmp
        - name: KUBECACHEDIR
          value: /tmp/.kube/cache
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        command:
        - sh
        - -c
        - |
          set -eu
          for crd in \
            environmentconfigs.apiextensions.crossplane.io \
            compositions.apiextensions.crossplane.io \
            compositeresourcedefinitions.apiextensions.crossplane.io \
            providerrevisions.pkg.crossplane.io \
            functions.pkg.crossplane.io; do
            echo "waiting for $crd to be established..."
            kubectl wait --for=condition=established --timeout=900s "crd/$crd"
          done
          echo "Crossplane's CRDs are established."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane-crd-wait
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-crd-wait
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-crd-wait
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-crd-wait
subjects:
- kind: ServiceAccount
  name: crossplane-crd-wait
  namespace: crossplane-system
