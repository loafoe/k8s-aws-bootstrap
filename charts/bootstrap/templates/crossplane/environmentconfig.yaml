# The cluster's own EnvironmentConfig: what the add-on compositions read (HelmApplication
# CRs from other repos, crossplane-providers-aws, the EBS/RDS compositions). Rendered from
# the same `.Values.environmentConfig` the chart's own templates use, so the two cannot
# drift.
#
# It used to come from an SSM parameter that the master applied during boot, because the
# bootstrap app's Helm values were themselves composed from it by the helmapp composition --
# a circle that required Crossplane to exist before Argo CD did. With the bootstrap app
# applied as a plain Application (k3s-on-ec2's resources/bootstrap-app-plain.yaml) the
# values are inlined there instead, and this object is just another chart resource.
#
# Wave 7: after the `crossplane` Application (wave 2) installs apiextensions.crossplane.io,
# with slack for it to be *established* -- the parent gates a wave on a child Application's
# health, and a fresh child reports Healthy with no status, so wave 4 still ran before
# Crossplane had applied anything (fleet01, 2026-11-25). Before the compositions at 8, which
# read these.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: {{ .Values.environmentConfig.resourcePrefix }}-environment
  labels:
    # Compositions select this by name and by this label.
    config: dip-software
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    # No CRD exists when Argo CD validates the whole app (the crossplane Application installs
    # apiextensions.crossplane.io at wave 2, after this validation but before this wave), so
    # skip the dry run and let the apply happen where the wave map puts it.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
# Explicit keys, not `toYaml .Values.environmentConfig`: `environmentConfig.bootstrap` also
# carries controlPlane (k3s-on-ec2's controlPlane output), which is chart config, not
# EnvironmentConfig data. scripts/check-bootstrap-render.sh renders each fixture with
# controlPlane=k3s and requires byte-identical output, which is how this stayed honest.
data:
  resourcePrefix: {{ .Values.environmentConfig.resourcePrefix | quote }}
  region: {{ .Values.environmentConfig.region | quote }}
  clusterFqdn: {{ .Values.environmentConfig.clusterFqdn | quote }}
  accountId: {{ .Values.environmentConfig.accountId | quote }}
  partition: {{ .Values.environmentConfig.partition | quote }}
  sharedServicesAccountId: {{ .Values.environmentConfig.sharedServicesAccountId | quote }}
  owner: {{ .Values.environmentConfig.owner | quote }}
  managedBy: {{ .Values.environmentConfig.managedBy | quote }}
  bootstrap:
    {{- omit .Values.environmentConfig.bootstrap "controlPlane" | toYaml | nindent 4 }}
