apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cloudnative-pg
  annotations:
    # VPA CRDs come from the vertical-pod-autoscaler app (sync wave 21); without this a
    # fresh cluster fails validation of this whole app until then
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  namespace: cnpg-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudnative-pg
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: manager
        maxAllowed:
          memory: 512Mi
