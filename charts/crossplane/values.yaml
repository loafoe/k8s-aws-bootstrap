crossplane:
  provider:
    defaultActivations: ["*"]
  image:
    repository: ghcr.io/crossplane/crossplane
  args:
    - --enable-operations
    # Default poll-interval is 1m: every managed/composite resource (postgres,
    # clusters, s3irsas, providerconfigs, ...) gets re-checked for drift and
    # status-patched that often even with nothing to do. This is a sandbox
    # cluster with no external actors mutating AWS resources outside
    # Crossplane. Was 10m; confirmed via audit-log rate comparison
    # (2026-09-09) that 10m did measurably cut crossplane's request rate, but
    # 2m keeps drift detection tighter as a middle ground while still well
    # below the 1m default. sync-interval (full double-check, default 1h) is
    # left alone.
    - --poll-interval=2m
    # Caps concurrency, not frequency: sync-interval/poll-interval only
    # control *when* reconciles fire, not how much work happens per tick.
    # Default worker pool (100) lets a full resync (e.g. the
    # managedresourcedefinitions/customresourcedefinitions churn seen during
    # the 2026-09-12 13:21 UTC leader-election-loss incident, ~785+197
    # writes in under 2 minutes) blast the apiserver all at once. Capping to
    # 20 spreads the same total work over more wall-clock time, lowering
    # peak concurrent writes regardless of when a resync lands. Trade-off:
    # legitimate multi-resource changes converge more slowly.
    - --max-concurrent-reconciles=20
  metrics:
    enabled: true
  resourcesCrossplane:
    requests:
      cpu: 5m
      memory: 256Mi
    limits:
      memory: 768Mi

  podSecurityContextCrossplane:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContextCrossplane:
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  podSecurityContextRBACManager:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContextRBACManager:
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # Schedule on system nodes like ArgoCD (critical addon)
  nodeSelector:
    node-type: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

  # rbacManager is also critical - schedule on system nodes
  rbacManager:
    leaderElection: false
    nodeSelector:
      node-type: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
  resourcesRBACManager:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 48Mi
