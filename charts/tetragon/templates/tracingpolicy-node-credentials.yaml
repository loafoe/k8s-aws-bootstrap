# Report-only: reads and writes of the files that let a process act as the node or the
# cluster admin. On a k3s node that is the admin kubeconfig and config under
# /etc/rancher/k3s, the server's join token, credentials and CA under
# /var/lib/rancher/k3s/server (master only), the kubelet/agent client certificates and keys
# under /var/lib/rancher/k3s/agent, plus the usual host secrets.
#
# Two selectors, ORed:
#   - Prefix: the host's own view of the paths (host processes, hostPath mounts at the
#     same place).
#   - Postfix: the distinctive file names wherever they are mounted, so a pod that mounts the
#     host root at /host (/host/etc/rancher/k3s/k3s.yaml) is still caught. Tetragon reports a
#     file's path as the reading process sees it, not the host path.
#
# Expected hits: k3s itself (start-up, certificate rotation) and the master's sync timers
# reading k3s.yaml. A read from any pod is the signal.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: node-credentials
  annotations:
    description: "Report access to k3s node and cluster credentials and host secrets"
spec:
  kprobes:
    - call: "security_file_permission"
      syscall: false
      return: true
      message: "Access to a node or cluster credential file"
      args:
        - index: 0
          type: "file" # struct file *, for the path
        - index: 1
          type: "int" # mask: 0x04 MAY_READ, 0x02 MAY_WRITE
      returnArg:
        index: 0
        type: "int"
      returnArgAction: "Post"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/rancher/k3s/"
                - "/var/lib/rancher/k3s/server/token"
                - "/var/lib/rancher/k3s/server/node-token"
                - "/var/lib/rancher/k3s/server/agent-token"
                - "/var/lib/rancher/k3s/server/cred/"
                - "/var/lib/rancher/k3s/server/tls/"
                - "/var/lib/rancher/k3s/agent/client-"
                - "/var/lib/rancher/k3s/agent/serving-"
                - "/etc/shadow"
                - "/etc/sudoers"
                - "/root/.ssh/"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
        - matchArgs:
            - index: 0
              operator: "Postfix"
              values:
                - "/rancher/k3s/k3s.yaml"
                - "/k3s/server/token"
                - "/k3s/server/node-token"
                - "/k3s/server/cred/admin.kubeconfig"
                - "/k3s/agent/client-kubelet.key"
                - "/etc/shadow"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
