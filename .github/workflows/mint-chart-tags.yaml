name: Mint Chart Tags

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mint-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # A tag's target commit can be old enough that its .github/workflows/**
      # content differs from the current default branch (workflow files
      # change over time); GitHub treats pushing any ref to such a commit as
      # "updating a workflow" and rejects it without this permission.
      workflows: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git identity for annotated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Mint any missing chart version tags
        run: ./scripts/mint-chart-tags.sh
