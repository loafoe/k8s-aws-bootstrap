name: Mint Chart Tags

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mint-chart-tags-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mint-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned like bootstrap-render.yaml/helm-deps.yaml: a newly minted tag's
      # repoint PR regenerates the golden files (via bump-app-tag.sh, called
      # below), and that has to render with the same helm version the PR's own
      # Bootstrap Render check later re-verifies against, or the diff won't
      # match. ubuntu-latest ships *some* helm, but not necessarily this one.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.0

      - name: Configure git identity for annotated tags and the repoint commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Mints any missing chart tags, then -- in the same job, not via
      # bump-app-tag.yaml's own push:tags: trigger -- opens the targetRevision
      # repoint PR for each one. GitHub does not start a new workflow run for
      # a ref pushed with the default GITHUB_TOKEN (confirmed experimentally:
      # a tag pushed by this same credential at a brand new commit did not
      # fire bump-app-tag.yaml), so chaining has to happen here instead of
      # relying on that trigger. bump-app-tag.yaml's own trigger still serves
      # a human manually pushing a tag with their own credentials, which does
      # fire normally.
      - name: Mint any missing chart version tags and open their repoint PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/mint-chart-tags.sh
