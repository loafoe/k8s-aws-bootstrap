name: Mint Chart Tags

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mint-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mint any missing chart version tags
        run: ./scripts/mint-chart-tags.sh
