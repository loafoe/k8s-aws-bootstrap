name: Bump App Tag

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        required: true

concurrency:
  group: bump-app-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-app-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git identity for the repoint commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Open PR repointing targetRevision
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env:, never interpolated directly into the run: shell line --
          # a ref/tag name containing shell metacharacters must not be able
          # to execute anything.
          TARGET_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: ./scripts/bump-app-tag.sh "$TARGET_TAG"
