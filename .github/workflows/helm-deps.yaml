name: Update Helm Dependencies

on:
  workflow_run:
    workflows: ["Renovate"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: helm-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-deps:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      # Only for scripts/check-chart-deps.sh: the branches below are cloned
      # separately, and ones cut before that script existed do not have it.
      - name: Checkout
        uses: actions/checkout@v5

      # helm and yq are pinned to the versions the Images Lock workflow checks
      # with (.github/workflows/images-lock.yaml). The generator here and the
      # check there must render with the same tools, or every regenerated
      # images.lock shows up as a diff in the check. Keep the two in lockstep.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.0

      - name: Set up yq
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: v4.53.6
        run: |
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Update chart dependencies on Renovate branches
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          set -euo pipefail

          # helm dependency update with a few retries. Registries throttle the
          # shared GitHub runner IPs (public.ecr.aws answers 429 "Data limit
          # exceeded" for anonymous pulls), so a single failed download is not
          # a reason to give up on the chart.
          update_deps() {
            local dir="$1" attempt
            for attempt in 1 2 3; do
              helm dependency update "$dir" && return 0
              if [ "$attempt" -lt 3 ]; then
                echo "  helm dependency update failed for $dir (attempt $attempt), retrying in $((attempt * 30))s"
                sleep $((attempt * 30))
              fi
            done
            return 1
          }

          # Same retry for the images.lock render: `oci://` Applications are
          # pulled while rendering, so it can hit the same throttling.
          regenerate_images_lock() {
            local attempt out
            out=$(mktemp)
            for attempt in 1 2 3; do
              if "$GITHUB_WORKSPACE/scripts/generate-images.sh" >"$out"; then
                mv "$out" images.lock
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "  generate-images.sh failed (attempt $attempt), retrying in $((attempt * 30))s"
                sleep $((attempt * 30))
              fi
            done
            rm -f "$out"
            return 1
          }

          # branch:chart pairs that could not be re-vendored, reported at the end
          failures=""

          # Only repository-local renovate/* branches are ever pushed to. A fork
          # PR can carry a head branch with the same name, so isCrossRepository
          # is filtered out: forks and human-authored branches are never
          # modified and keep failing their checks with the manual instructions.
          branches=$(gh pr list --repo ${{ github.repository }} --state open --json headRefName,isCrossRepository --jq '.[] | select((.isCrossRepository | not) and (.headRefName | startswith("renovate/"))) | .headRefName')
          # main is checked too: a version bump can land on main without anyone
          # re-vendoring, and no renovate PR exists to trigger the check above.
          branches="$branches
          main"

          for branch in $branches; do
            echo "=== Checking $branch ==="
            tmp=$(mktemp -d)
            git clone --branch "$branch" --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$tmp"
            pushd "$tmp"

            updated=false
            for chart in charts/*/Chart.yaml; do
              [ -f "$chart" ] || continue
              dir=$(dirname "$chart")

              if ! "$GITHUB_WORKSPACE/scripts/check-chart-deps.sh" "$dir"; then
                echo "  Re-vendoring $dir"
                mkdir -p "$dir/charts"
                rm -f "$dir/charts/"*.tgz
                if update_deps "$dir"; then
                  # The vendored tarballs are part of the chart artifact, so
                  # re-vendoring changes the chart and has to move its version.
                  # Keeps the wrapper version from going stale under renovate.
                  ./scripts/bump-chart-version.sh "$dir"
                  updated=true
                else
                  # One chart failing must not cost the others their fix: a
                  # karpenter download hitting 429 used to abort the whole job
                  # before the push, so the cilium re-vendor already done on the
                  # same branch was thrown away and every later branch -- main
                  # included -- was never checked. Put this chart back the way
                  # it was and carry on.
                  echo "::error::Could not re-vendor $dir on $branch"
                  git checkout -- "$dir"
                  git clean -fdq -- "$dir"
                  failures="$failures $branch:$dir"
                fi
              fi
            done

            # Renovate's custom regex managers can edit chart template/values
            # content directly (e.g. crossplaneCompositions's targetRevision
            # in charts/bootstrap/templates/crossplane-compositions/
            # crossplane-compositions-app.yaml) without bumping that chart's
            # own version -- the same class of problem
            # check-chart-version-bump.sh catches for a human-authored PR,
            # but nothing fixed it automatically for a Renovate-authored one
            # the way re-vendoring is fixed above (PR #440).
            # Explicit refspec: the clone above is single-branch (--branch
            # "$branch" --depth 1), so a bare "git fetch origin main" fetches
            # the commit but never creates/updates refs/remotes/origin/main --
            # the remote's fetch refspec is still restricted to the branch
            # that was originally cloned.
            git fetch -q --depth 1 origin main:refs/remotes/origin/main
            for chart in charts/*/Chart.yaml; do
              [ -f "$chart" ] || continue
              dir=$(dirname "$chart")
              if ! git diff --quiet origin/main -- "$dir/values.yaml" "$dir/templates" 2>/dev/null; then
                current=$(awk '/^version:[[:space:]]*/ { v=$0; sub(/^version:[[:space:]]*/,"",v); gsub(/["'"'"'[:space:]]/,"",v); print v; exit }' "$chart")
                before=$(git show "origin/main:$chart" 2>/dev/null | awk '/^version:[[:space:]]*/ { v=$0; sub(/^version:[[:space:]]*/,"",v); gsub(/["'"'"'[:space:]]/,"",v); print v; exit }')
                if [ "$current" = "$before" ]; then
                  echo "  Bumping $dir (template/values changed without a version bump)"
                  ./scripts/bump-chart-version.sh "$dir"
                  updated=true
                fi
              fi
            done

            # The rendered golden fixtures follow any charts/** content
            # change -- a dependency re-vendor above, or the hand-authored
            # edit just caught -- so regenerate them in the same commit, on
            # every branch, the same way images.lock already is below.
            if [ -f scripts/check-bootstrap-render.sh ]; then
              scripts/check-bootstrap-render.sh --update >/dev/null 2>&1 || true
              if ! git diff --quiet -- tests/render/golden; then
                echo "  Regenerated golden render fixtures"
                updated=true
              fi
            fi

            # images.lock follows the vendored charts, so regenerate it after
            # the re-vendor and ship it in the same commit. It runs on every
            # branch, not only re-vendored ones: the tarballs may already have
            # been pushed (or hand-edited) while the lock is still stale. A
            # failed render leaves the existing images.lock untouched.
            if [ -f images.lock ]; then
              if regenerate_images_lock; then
                if ! git diff --quiet -- images.lock; then
                  echo "  Regenerated images.lock"
                  updated=true
                fi
              else
                echo "::error::Could not regenerate images.lock on $branch"
                git checkout -- images.lock
                failures="$failures $branch:images.lock"
              fi
            fi

            if [ "$updated" = true ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "chore: update helm dependency artifacts"
                git push
                echo "  Pushed update to $branch"
              fi
            else
              echo "  No updates needed"
            fi

            popd
            rm -rf "$tmp"
          done

          # Fail the run only after every branch has had its chance, so the
          # failure is visible without blocking the charts that did succeed.
          if [ -n "$failures" ]; then
            echo "::error::Charts left out of sync:$failures"
            exit 1
          fi
