name: Update Helm Dependencies

on:
  workflow_run:
    workflows: ["Renovate"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: helm-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-deps:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      # Only for scripts/check-chart-deps.sh: the branches below are cloned
      # separately, and ones cut before that script existed do not have it.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update chart dependencies on Renovate branches
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          set -euo pipefail

          # helm dependency update with a few retries. Registries throttle the
          # shared GitHub runner IPs (public.ecr.aws answers 429 "Data limit
          # exceeded" for anonymous pulls), so a single failed download is not
          # a reason to give up on the chart.
          update_deps() {
            local dir="$1" attempt
            for attempt in 1 2 3; do
              helm dependency update "$dir" && return 0
              if [ "$attempt" -lt 3 ]; then
                echo "  helm dependency update failed for $dir (attempt $attempt), retrying in $((attempt * 30))s"
                sleep $((attempt * 30))
              fi
            done
            return 1
          }

          # branch:chart pairs that could not be re-vendored, reported at the end
          failures=""

          branches=$(gh pr list --repo ${{ github.repository }} --state open --json headRefName --jq '.[] | select(.headRefName | startswith("renovate/")) | .headRefName')
          # main is checked too: a version bump can land on main without anyone
          # re-vendoring, and no renovate PR exists to trigger the check above.
          branches="$branches
          main"

          for branch in $branches; do
            echo "=== Checking $branch ==="
            tmp=$(mktemp -d)
            git clone --branch "$branch" --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$tmp"
            pushd "$tmp"

            updated=false
            for chart in charts/*/Chart.yaml; do
              [ -f "$chart" ] || continue
              dir=$(dirname "$chart")

              if ! "$GITHUB_WORKSPACE/scripts/check-chart-deps.sh" "$dir"; then
                echo "  Re-vendoring $dir"
                mkdir -p "$dir/charts"
                rm -f "$dir/charts/"*.tgz
                if update_deps "$dir"; then
                  # The vendored tarballs are part of the chart artifact, so
                  # re-vendoring changes the chart and has to move its version.
                  # Keeps the wrapper version from going stale under renovate.
                  ./scripts/bump-chart-version.sh "$dir"
                  updated=true
                else
                  # One chart failing must not cost the others their fix: a
                  # karpenter download hitting 429 used to abort the whole job
                  # before the push, so the cilium re-vendor already done on the
                  # same branch was thrown away and every later branch -- main
                  # included -- was never checked. Put this chart back the way
                  # it was and carry on.
                  echo "::error::Could not re-vendor $dir on $branch"
                  git checkout -- "$dir"
                  git clean -fdq -- "$dir"
                  failures="$failures $branch:$dir"
                fi
              fi
            done

            if [ "$updated" = true ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "chore: update helm dependency artifacts"
                git push
                echo "  Pushed update to $branch"
              fi
            else
              echo "  No updates needed"
            fi

            popd
            rm -rf "$tmp"
          done

          # Fail the run only after every branch has had its chance, so the
          # failure is visible without blocking the charts that did succeed.
          if [ -n "$failures" ]; then
            echo "::error::Charts left out of sync:$failures"
            exit 1
          fi
