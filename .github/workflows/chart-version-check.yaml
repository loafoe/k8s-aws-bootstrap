name: Chart Version Check

on:
  pull_request:
    paths:
      - 'charts/**'
  workflow_dispatch:

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares against the PR base, so the full history is
          # needed to read the previous version out of the base ref.
          fetch-depth: 0

      - name: Check chart versions were bumped
        run: |
          base_ref='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base_ref" ]; then
            base_ref='origin/main'
          fi
          ./scripts/check-chart-version-bump.sh "$base_ref"

  deps-vendored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Renovate PRs start out red here and turn green once the Update Helm
      # Dependencies workflow pushes its artifacts commit. If that workflow
      # fails, this stays red instead of the PR looking ready to merge.
      - name: Check chart dependencies are vendored
        run: ./scripts/check-chart-deps.sh
