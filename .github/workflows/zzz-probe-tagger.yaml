name: ZZZ Probe Tagger (temporary, delete after use)

on:
  workflow_dispatch:

jobs:
  push-probe-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a zzz-token-probe-1 -m "probe: does a GITHUB_TOKEN-pushed tag at a fresh commit trigger push:tags: workflows"
          git push origin zzz-token-probe-1
